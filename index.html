<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="다시봄 · 텔로미어 라이프스타일 & 데일리 셀 케어 — 온·오프라인 판매 POS">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>다시봄 POS · 텔로미어 라이프스타일</title>
<style>
/* =========================================================================
   다시봄 POS — 텔로미어 라이프스타일 & 데일리 셀 케어
   단일 파일 · 외부 CSS/JS/CDN 의존 없음
   팔레트: 딥 포레스트 그린 · 웜 아이보리 · 샴페인 골드
   ========================================================================= */
:root{
  /* 팔레트: 지쿱 공식몰 퓨어 화이트 톤 + 텔로메라 포인트(#6d3d82) */
  --bg:#ffffff;
  --bg-2:#f8f9fa;
  --surface:#ffffff;
  --surface-2:#f5f6f8;
  --ink:#111111;
  --ink-2:#333333;
  --muted:#666666;
  --line:#e6e8ec;
  --line-2:#d5d8de;
  --brand:#7b4696;
  --brand-2:#955cb3;
  --brand-3:#a872c2;
  --brand-50:#f7f2fa;
  --brand-100:#e7d9f0;
  --accent:#854ea0;
  --accent-2:#d2bae2;
  --accent-soft:#f7f2fa;
  --danger:#c92a2a;
  --danger-50:#fff5f5;
  --ok:#2b6cb0;
  --ok-50:#ebf8ff;
  --r:10px;
  --r-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
  --shadow-lg:0 20px 50px rgba(0,0,0,.18);
  --tap:44px;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; overflow-x:hidden; max-width:100%; }
html{ -webkit-text-size-adjust:100%; }
body{
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{ margin:0; font-weight:800; letter-spacing:-.02em; line-height:1.3; color:var(--ink); }
p{ margin:0; }
button{ font:inherit; color:inherit; }
img{ max-width:100%; }
:focus-visible{ outline:2px solid var(--brand-3); outline-offset:2px; }
[hidden]{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.kicker{
  font-size:9.5px; font-weight:800; letter-spacing:.22em; text-transform:uppercase;
  color:var(--accent); font-family:ui-serif,Georgia,"Times New Roman",serif;
}

/* ---------- 버튼 ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:var(--tap); padding:0 18px;
  border:1px solid var(--line-2); border-radius:var(--r);
  background:var(--surface); color:var(--ink);
  font-size:14px; font-weight:700; cursor:pointer;
  transition:background .18s, border-color .18s, transform .05s, box-shadow .18s;
  text-decoration:none; white-space:nowrap;
  box-shadow:0 1px 1px rgba(42,27,48,.03);
}
.btn:hover{ background:var(--surface-2); border-color:var(--accent-2); }
.btn:active{ transform:translateY(1px); }
.btn.primary{
  background:linear-gradient(140deg,#6b4477,#5d3969 60%,#40264c);
  border-color:#40264c; color:#fdf8ff;
  box-shadow:0 6px 18px rgba(93,57,105,.24);
}
.btn.primary:hover{ background:linear-gradient(140deg,#7a4f8a,#5d3969 65%); box-shadow:0 8px 22px rgba(93,57,105,.3); }
.btn.gold{ background:var(--accent-soft); border-color:var(--accent-2); color:#4a2b55; }
.btn.gold:hover{ background:#efe4f3; }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--muted); box-shadow:none; }
.btn.ghost:hover{ background:var(--surface-2); color:var(--ink); }
.btn.sm{ min-height:34px; padding:0 12px; font-size:13px; border-radius:9px; }
.btn.xs{ min-height:28px; padding:0 9px; font-size:12px; border-radius:8px; }
.btn.danger{ color:var(--danger); border-color:#eed3ce; background:var(--danger-50); }
.btn.block{ width:100%; }
.btn[disabled]{ opacity:.45; cursor:not-allowed; box-shadow:none; }
.icon-btn{
  width:36px; height:36px; min-height:36px; padding:0; border-radius:50%;
  border:1px solid transparent; background:transparent; color:var(--muted);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:17px; cursor:pointer;
}
.icon-btn:hover{ background:var(--surface-2); color:var(--ink); }

/* ---------- 상단 바 ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:rgba(250,248,251,.93);
  backdrop-filter:saturate(170%) blur(12px);
  -webkit-backdrop-filter:saturate(170%) blur(12px);
  border-bottom:1px solid var(--accent-2);
}
.topbar-inner{
  max-width:1260px; margin:0 auto;
  display:flex; align-items:center; gap:11px;
  padding:9px 18px;
  padding-top:calc(9px + env(safe-area-inset-top));
}
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark{ width:40px; height:40px; flex:0 0 40px; display:block; filter:drop-shadow(0 4px 10px rgba(93,57,105,.22)); }
.brand-mark svg{ display:block; width:100%; height:100%; }
.brand-text{ min-width:0; display:flex; flex-direction:column; gap:1px; }
.brand-name{
  font-size:16px; font-weight:800; letter-spacing:.06em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand-sub{
  display:inline-flex; align-items:center; gap:4px; max-width:100%;
  border:0; background:none; padding:0; margin:0;
  font-size:11px; color:var(--muted); letter-spacing:-.01em;
  cursor:pointer; text-align:left;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand-sub:hover{ color:var(--brand-2); text-decoration:underline; text-underline-offset:2px; }
.brand-sub .pin{ width:5px; height:5px; border-radius:50%; background:var(--accent); flex:0 0 5px; }
.modes{
  margin-left:auto; display:flex; gap:2px;
  background:var(--surface-2); border:1px solid var(--line);
  padding:3px; border-radius:999px; flex:0 0 auto;
}
.modes button{
  border:0; background:none; cursor:pointer;
  padding:7px 13px; border-radius:999px;
  font-size:12.5px; font-weight:800; color:var(--muted);
  line-height:1.2; white-space:nowrap; letter-spacing:-.02em;
  transition:background .18s, color .18s;
}
.modes button.active{ background:var(--brand); color:#fdf8ff; box-shadow:0 2px 10px rgba(93,57,105,.28); }
.net-pill{
  display:none; align-items:center; gap:5px;
  font-size:11px; font-weight:700; color:#7a5a22;
  background:var(--accent-soft); border:1px solid var(--accent-2);
  padding:4px 9px; border-radius:999px;
}
.net-pill.show{ display:inline-flex; }
.sync-dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); }

/* ---------- 레이아웃 ---------- */
.app{ max-width:1260px; margin:0 auto; padding:14px 18px 40px; }
#customerView{ display:block; }
.cust-layout{ display:grid; grid-template-columns:minmax(0,1fr) 376px; gap:18px; align-items:start; }

/* ---------- 브랜드 배너 ---------- */
.hero{
  position:relative; overflow:hidden;
  border-radius:16px; margin:0 0 18px;
  background:linear-gradient(135deg,#faf7fc 0%,#ffffff 55%,#f3ebf8 100%);
  border:1px solid #eadff2;
  color:#111111;
  padding:22px 24px 20px;
  box-shadow:0 4px 16px rgba(109,61,130,.06);
}
.hero::after{
  content:""; position:absolute; left:24px; right:24px; bottom:0; height:1px;
  background:linear-gradient(90deg,transparent,rgba(203,179,214,.55),transparent);
}
.hero-deco{
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none; opacity:.14;
}
.hero-inner{ position:relative; z-index:1; max-width:560px; }
.hero .kicker{ color:var(--brand); opacity:1; }
.hero-title{
  font-size:26px; font-weight:800; letter-spacing:.14em; color:#111111;
  margin:7px 0 6px; line-height:1.2;
}
.hero-copy{ font-size:13px; color:#555555; letter-spacing:-.01em; line-height:1.6; }
.hero-meta{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px;
}
.hero-chip{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:700; color:var(--brand);
  border:1px solid #e2d1ee; border-radius:999px;
  padding:4px 10px; background:#ffffff;
}

/* ---------- 카탈로그 ---------- */
.catalog{ min-width:0; }
.catalog-head{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
.search-box{ position:relative; }
.search-box input{
  width:100%; height:46px; padding:0 42px;
  border:1px solid var(--line-2); border-radius:var(--r);
  background:var(--surface); font-size:14.5px; color:var(--ink);
  box-shadow:0 1px 2px rgba(42,27,48,.03);
}
.search-box input::placeholder{ color:#a99cb2; }
.search-box input:focus{ border-color:var(--brand-3); outline:0; box-shadow:0 0 0 3px var(--brand-50); }
.search-box .ico{ position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:15px; }
.search-clear{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  width:30px; height:30px; border-radius:50%; border:0; background:var(--surface-2);
  color:var(--muted); cursor:pointer; display:none;
}
.search-clear.show{ display:block; }
.chips{ display:flex; gap:7px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto; padding:8px 14px; border-radius:999px;
  border:1px solid var(--line); background:var(--surface);
  font-size:12.5px; font-weight:700; color:var(--ink-2); cursor:pointer;
  min-height:36px; letter-spacing:-.01em;
  transition:background .16s,border-color .16s,color .16s;
}
.chip:hover{ border-color:var(--accent-2); }
.chip.active{ background:var(--brand); border-color:var(--brand); color:#fdf8ff; }

.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(216px,1fr)); gap:14px; }
/* '전체' 보기: 지쿱 라인별 섹션으로 묶어 보여 준다 */
.grid.line-wrap{ display:block; }
.line-sec + .line-sec{ margin-top:22px; }
.line-head{ display:flex; align-items:center; gap:7px; margin:0 0 10px; }
.line-head h2{ font-size:15.5px; letter-spacing:-.03em; color:var(--ink); white-space:nowrap; }
.line-count{ font-size:12px; font-weight:800; color:var(--brand-2); background:var(--brand-50);
  border:1px solid var(--brand-100); border-radius:999px; padding:1px 8px; white-space:nowrap; }
.line-head::after{ content:""; flex:1; height:1px; background:var(--line); min-width:16px; }
.line-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(216px,1fr)); gap:14px; }
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); overflow:hidden;
  display:flex; flex-direction:column;
  cursor:pointer; text-align:left; padding:0;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s;
  position:relative;
}
.card:hover{ transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--accent-2); }
.card:active{ transform:translateY(-1px); }
.card-media{
  position:relative; aspect-ratio:1/1; background:#fff;
  border-bottom:1px solid var(--line);
  display:grid; place-items:center; overflow:hidden;
}
.card-media img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s ease; }
.card:hover .card-media img{ transform:scale(1.03); }
.card-body{ padding:12px 13px 13px; display:flex; flex-direction:column; gap:5px; flex:1; }
.card-tags{
  display:flex; flex-wrap:wrap; align-items:center; gap:4px 5px;
  min-width:0; max-width:100%;
}
.cat-tag{
  flex:0 1 auto; min-width:0; align-self:flex-start;
  font-size:10px; font-weight:800; letter-spacing:.02em;
  color:var(--brand-2); background:var(--brand-50);
  border:1px solid var(--brand-100); border-radius:5px; padding:2px 7px;
}
.card h3{ font-size:14px; letter-spacing:-.02em; line-height:1.38; }
.card .card-sum{
  color:var(--muted); font-size:11.5px; line-height:1.5;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.card-foot{ margin-top:auto; padding-top:9px; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
.price{ font-size:17px; font-weight:800; letter-spacing:-.035em; white-space:nowrap; color:var(--ink); }
.price .unit{ font-size:11.5px; font-weight:700; color:var(--muted); margin-left:1px; }
.add-btn{
  min-width:var(--tap); min-height:36px; padding:0 13px; border-radius:10px;
  border:1px solid var(--brand); background:var(--brand); color:#fdf8ff;
  font-size:12.5px; font-weight:800; cursor:pointer;
  display:inline-flex; align-items:center; gap:4px;
  box-shadow:0 3px 10px rgba(93,57,105,.18);
  transition:background .16s, box-shadow .16s;
}
.add-btn:hover{ background:var(--brand-2); box-shadow:0 4px 14px rgba(93,57,105,.24); }
.add-btn[disabled]{ background:var(--surface-2); border-color:var(--line); color:#a99cb2; cursor:not-allowed; box-shadow:none; }
.tag-soldout{
  position:absolute; inset:0; display:grid; place-items:center;
  background:rgba(250,248,251,.76); color:var(--ink-2);
  font-weight:800; font-size:13px; letter-spacing:.14em;
}
.empty{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:54px 20px; color:var(--muted); text-align:center;
  background:var(--surface); border:1px dashed var(--line-2); border-radius:var(--r-lg);
}
.empty .big{ font-size:28px; }

/* ---------- 주문서 ---------- */
.cart-panel{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); box-shadow:var(--shadow);
  position:sticky; top:76px;
  display:flex; flex-direction:column;
}
.cart-head{
  display:flex; align-items:center; gap:8px;
  padding:14px 16px 11px; border-bottom:1px solid var(--accent-2);
  background:linear-gradient(180deg,#fbf7fc,rgba(251,247,252,0));
}
.cart-head h2{ font-size:14.5px; letter-spacing:.02em; }
.cart-count{
  font-size:11px; font-weight:800; color:var(--brand-2);
  background:var(--brand-50); border:1px solid var(--brand-100);
  border-radius:999px; padding:2px 8px;
}
.cart-head .icon-btn{ margin-left:auto; display:none; }
.cart-scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 0; max-height:36vh; }
.cart-lines{ display:flex; flex-direction:column; }
.cart-line{
  display:grid; grid-template-columns:1fr auto; gap:2px 8px;
  padding:11px 16px; border-bottom:1px solid #f4eef7;
}
.cart-line .cl-name{ font-size:13px; font-weight:700; letter-spacing:-.02em; }
.cart-line .cl-meta{ grid-column:1/2; font-size:11px; color:var(--muted); display:flex; align-items:center; gap:8px; }
.cart-line .cl-meta button{ border:0; background:none; padding:0; font-size:11px; color:#b0a4b9; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
.cart-line .cl-meta button:hover{ color:var(--danger); }
.cart-line .cl-right{ grid-row:1/3; grid-column:2/3; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
.qty{
  display:inline-flex; align-items:center;
  border:1px solid var(--line); border-radius:9px; overflow:hidden;
  background:var(--surface);
}
.qty button{
  width:32px; height:30px; border:0; background:var(--surface);
  font-size:15px; font-weight:800; color:var(--ink-2); cursor:pointer;
}
.qty button:hover{ background:var(--surface-2); }
.qty span{ min-width:26px; text-align:center; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; }
.cl-sum{ font-size:13px; font-weight:800; letter-spacing:-.02em; }
.cart-empty{ padding:36px 20px; text-align:center; color:var(--muted); font-size:12.5px; line-height:1.7; }
.cart-empty .big{ font-size:24px; display:block; margin-bottom:6px; opacity:.8; }

.totals{ padding:12px 16px 6px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:7px; background:linear-gradient(180deg,rgba(243,238,246,.55),transparent); }
.totals .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12.5px; }
.totals .row > span{ color:var(--muted); font-weight:700; }
.totals .row > b{ font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.disc-row{ display:flex; align-items:center; gap:6px; }
.disc-row select{
  height:32px; border:1px solid var(--line); border-radius:8px; background:var(--surface);
  font-size:12px; font-weight:700; color:var(--ink-2); padding:0 4px;
}
.disc-row input{
  width:92px; height:32px; border:1px solid var(--line); border-radius:8px;
  padding:0 8px; font-size:13px; font-weight:700; text-align:right;
}
.totals .grand{ padding-top:8px; border-top:1px dashed var(--line-2); font-size:14px; }
.totals .grand > b{ font-size:21px; color:var(--brand); letter-spacing:-.04em; }

.order-form{ padding:10px 16px 14px; display:flex; flex-direction:column; gap:9px; border-top:1px solid var(--line); }
.field{ display:flex; flex-direction:column; gap:5px; }
.field > label{ font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.02em; }
.field input,.field select,.field textarea{
  width:100%; min-height:38px; padding:8px 10px;
  border:1px solid var(--line-2); border-radius:9px; background:var(--surface);
  font-size:13.5px; color:var(--ink); font-family:inherit;
}
.field textarea{ min-height:54px; resize:vertical; }
.field input:focus,.field select:focus,.field textarea:focus{ border-color:var(--brand-3); outline:0; box-shadow:0 0 0 3px var(--brand-50); }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.seg{ display:flex; gap:3px; background:var(--surface-2); border:1px solid var(--line); padding:3px; border-radius:10px; }
.seg button{
  flex:1; min-height:32px; border:0; background:none; border-radius:8px;
  font-size:12px; font-weight:800; color:var(--muted); cursor:pointer; padding:0 6px;
  letter-spacing:-.02em;
}
.seg button.active{ background:var(--surface); color:var(--brand); box-shadow:0 1px 3px rgba(42,27,48,.12); }
.order-cta{ display:flex; flex-direction:column; gap:6px; padding:0 16px 14px; }
.cta-note{ font-size:10.5px; color:var(--muted); text-align:center; line-height:1.5; }

/* ---------- 모바일 주문서 바 ---------- */
.cart-bar{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:45;
  background:rgba(251,247,252,.97);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--accent-2);
  padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  gap:12px; align-items:center;
  box-shadow:0 -10px 30px rgba(42,27,48,.1);
}
.cart-bar .cb-info{ display:flex; flex-direction:column; line-height:1.25; min-width:0; }
.cart-bar .cb-count{ font-size:10.5px; font-weight:800; color:var(--muted); letter-spacing:.02em; }
.cart-bar .cb-total{ font-size:18px; font-weight:800; letter-spacing:-.04em; color:var(--brand); }
.cart-bar .btn{ flex:0 0 auto; }

/* ---------- 모달 ---------- */
.modal-backdrop{
  position:fixed; inset:0; z-index:70;
  background:rgba(42,27,48,.5);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  animation:fade .18s ease;
}
@keyframes fade{ from{opacity:0} to{opacity:1} }
.modal{
  background:var(--surface); border-radius:22px;
  width:min(720px,100%); max-height:90vh;
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:var(--shadow-lg);
  border:1px solid rgba(203,179,214,.5);
  animation:pop .2s ease;
}
@keyframes pop{ from{ transform:translateY(12px); opacity:.6 } to{ transform:none; opacity:1 } }
.modal-head{
  display:flex; align-items:center; gap:10px;
  padding:14px 18px; border-bottom:1px solid var(--line);
  flex:0 0 auto; background:linear-gradient(180deg,#fbf7fc,var(--surface));
}
.modal-head h2{ font-size:15px; letter-spacing:.01em; }
.modal-head .kicker{ margin-left:auto; }
.modal-head .icon-btn{ margin-left:auto; }
.modal-head .kicker + .icon-btn{ margin-left:8px; }
.modal-body{ overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px; }
.modal-foot{
  flex:0 0 auto; padding:12px 18px;
  border-top:1px solid var(--accent-2); background:var(--surface);
  display:flex; gap:8px; align-items:center;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));
}
.modal-foot .grow{ flex:1; min-width:0; }
.modal-foot .btn.grow{ white-space:normal; line-height:1.25; text-align:center; }
.modal.wide{ width:min(880px,100%); }
.modal.narrow{ width:min(404px,100%); }
/* 주문 확인서: 종이 영수증처럼 좁고 세로로 긴 모달 */
.modal.rc-modal{ width:min(404px,100%); max-height:92vh; }
.modal.rc-modal .modal-body{ padding:14px; }
.modal.rc-modal .receipt{ padding:16px 15px; border-radius:12px; }
.modal.rc-modal .rc-meta{ gap:5px 8px; }
.modal.rc-modal .rc-meta dd{ word-break:break-word; }

/* ---------- 상품 상세 ---------- */
.detail-hero{ position:relative; background:linear-gradient(170deg,#f5f1f7,#ffffff); border-bottom:1px solid var(--line); }
.detail-media{ aspect-ratio:16/10; display:grid; place-items:center; overflow:hidden; }
.detail-media img{ width:100%; height:100%; object-fit:contain; }
.detail-deco{
  position:absolute; right:-14px; bottom:-18px; width:168px; height:168px;
  opacity:.16; pointer-events:none; z-index:0;
}
.detail-hero .kicker{
  position:absolute; left:18px; top:14px; z-index:1;
  background:rgba(255,255,255,.9); border:1px solid var(--accent-2);
  border-radius:999px; padding:4px 10px; letter-spacing:.16em;
}
.detail-body{ padding:18px 20px 8px; display:flex; flex-direction:column; gap:15px; }
.detail-title{ display:flex; flex-direction:column; gap:7px; }
.detail-title h2{ font-size:22px; letter-spacing:-.03em; line-height:1.28; }
.detail-sum{ color:var(--ink-2); font-size:13.5px; line-height:1.6; }
.detail-price{ display:flex; align-items:baseline; gap:7px; }
.detail-price b{ font-size:28px; font-weight:800; letter-spacing:-.045em; color:var(--brand); }
.detail-price span{ font-size:12px; color:var(--muted); font-weight:700; }
.dsec{ border-top:1px solid var(--line); padding-top:14px; }
.dsec h3{
  font-size:12px; color:var(--brand-2); letter-spacing:.02em;
  margin-bottom:8px; display:flex; align-items:center; gap:7px;
}
.dsec h3::before{ content:""; width:3px; height:12px; border-radius:2px; background:var(--accent); }
.dsec p{ font-size:13px; line-height:1.7; color:var(--ink-2); white-space:pre-line; }
.dsec ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px; }
.dsec li{
  position:relative; padding-left:18px;
  font-size:13px; line-height:1.6; color:var(--ink-2);
}
.dsec li::before{
  content:""; position:absolute; left:2px; top:7px;
  width:7px; height:7px; border-radius:50%;
  background:var(--brand-100); box-shadow:inset 0 0 0 2px var(--brand-3);
}
.dsec.caution p{ color:#7a5a22; background:#fdf7e8; border:1px solid #f0e2c0; border-radius:10px; padding:10px 12px; font-size:12px; }
.detail-note{ font-size:10.5px; color:var(--muted); padding:0 20px 16px; line-height:1.6; }
.detail-qty{ display:flex; align-items:center; gap:9px; }
.detail-qty .qty button{ width:38px; height:38px; }
.detail-qty .qty span{ min-width:34px; font-size:15px; }

/* ---------- 제품 설명서(리플렛) ---------- */
.leaf-open{
  display:flex; align-items:center; gap:12px; width:100%;
  min-height:56px; padding:10px 14px; cursor:pointer;
  border:1px solid var(--accent-2); border-radius:14px;
  background:linear-gradient(140deg,#faf5fc,#f2e9f7);
  color:#3f2450; text-align:left;
  box-shadow:0 2px 8px rgba(93,57,105,.06);
  transition:background .18s, border-color .18s, transform .05s;
}
.leaf-open:hover{ background:linear-gradient(140deg,#f6edfa,#ecdff4); border-color:var(--brand-3); }
.leaf-open:active{ transform:translateY(1px); }
.leaf-open .lo-ico{
  flex:0 0 auto; width:34px; height:34px; border-radius:10px;
  background:#fff; border:1px solid var(--accent-2); color:var(--brand);
  display:grid; place-items:center;
}
.leaf-open .lo-txt{ display:flex; flex-direction:column; gap:2px; flex:1 1 auto; min-width:0; }
.leaf-open .lo-txt b{ font-size:14px; letter-spacing:-.01em; }
.leaf-open .lo-txt span{ font-size:11.5px; color:var(--muted); font-weight:600; line-height:1.4; }
.leaf-open .lo-arrow{ flex:0 0 auto; font-size:20px; line-height:1; color:var(--brand-2); }

.modal-head .leaf-back{ margin-left:0; font-size:19px; }
.leaf-modal .modal-body{ padding:0; }
.leaf-hero{
  padding:16px 20px 14px; display:flex; flex-direction:column; gap:9px;
  background:linear-gradient(170deg,#f7f2fa,#ffffff); border-bottom:1px solid var(--line);
}
.leaf-chips{ display:flex; flex-wrap:wrap; gap:6px; }
.leaf-chip{
  font-size:10.5px; font-weight:800; letter-spacing:.01em; color:#4a2b55;
  background:#fff; border:1px solid var(--accent-2); border-radius:999px; padding:3px 9px;
}
.leaf-name{ font-size:20px; line-height:1.3; letter-spacing:-.02em; }
.leaf-tagline{ font-size:13.5px; line-height:1.6; color:var(--ink-2); }
.leaf-body{ padding:16px 20px 12px; display:flex; flex-direction:column; gap:16px; }
.leaf-figure{ margin:0; border:1px solid var(--line); border-radius:12px; background:#fbfafc; overflow:hidden; }
.leaf-figure img{ display:block; width:100%; max-width:100%; height:auto; }
.leaf-sec{ display:flex; flex-direction:column; gap:8px; }
.leaf-sec > h3{
  font-size:12px; color:var(--brand-2); letter-spacing:.02em;
  display:flex; align-items:center; gap:7px;
}
.leaf-sec > h3::before{ content:""; width:3px; height:12px; border-radius:2px; background:var(--accent); }
.leaf-sec p{ font-size:13px; line-height:1.75; color:var(--ink-2); overflow-wrap:anywhere; }
.leaf-sec ul{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px; }
.leaf-sec li{
  position:relative; padding-left:16px;
  font-size:13px; line-height:1.65; color:var(--ink-2); overflow-wrap:anywhere;
}
.leaf-sec li::before{
  content:""; position:absolute; left:2px; top:8px;
  width:5px; height:5px; border-radius:50%; background:var(--brand-3);
}
.leaf-sec.caution{
  background:#fdf9ef; border:1px solid #f0e2c0; border-radius:12px; padding:12px 14px;
}
.leaf-sec.caution > h3{ color:#8a6a1f; }
.leaf-sec.caution > h3::before{ background:#d8a13a; }
.leaf-sec.caution li{ color:#7a5a22; }
.leaf-sec.caution li::before{ background:#d8a13a; }
.leaf-info{ border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#fff; }
.leaf-info-row{ display:grid; grid-template-columns:minmax(88px,32%) 1fr; border-top:1px solid var(--line); }
.leaf-info-row:first-child{ border-top:0; }
.leaf-info dt{
  font-size:11.5px; font-weight:800; color:var(--muted); background:var(--surface-2);
  padding:8px 10px; overflow-wrap:anywhere;
}
.leaf-info dd{
  margin:0; padding:8px 11px; font-size:12.5px; line-height:1.7; color:var(--ink-2);
  white-space:pre-line; overflow-wrap:anywhere;
}
.leaf-gallery{ display:flex; flex-direction:column; gap:10px; }
.leaf-disclaimer{
  font-size:11px; line-height:1.65; color:var(--muted);
  background:var(--surface-2); border-radius:10px; padding:10px 12px;
}
.leaf-msg{
  border:1px solid var(--accent-2); background:#f7f2fa; border-radius:12px;
  padding:13px 15px; font-size:12.5px; line-height:1.7; color:#4a2b55;
}
.leaf-msg b{ display:block; margin-bottom:4px; font-size:13px; }

/* ---------- 영수증 ---------- */
.receipt{
  border:1px solid var(--accent-2); border-radius:14px; padding:18px;
  background:linear-gradient(180deg,#ffffff,#fbf7fc);
  font-variant-numeric:tabular-nums;
}
.receipt-top{ text-align:center; padding-bottom:13px; border-bottom:1px dashed var(--line-2); margin-bottom:13px; }
.receipt-top .mark{ width:34px; height:34px; margin:0 auto 6px; }
.receipt-top .shop{ font-size:16px; font-weight:800; letter-spacing:.06em; }
.receipt-top .branch{ font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:.04em; }
.receipt-top .doc{ font-size:9.5px; color:var(--accent); margin-top:6px; letter-spacing:.2em; text-transform:uppercase; font-family:ui-serif,Georgia,serif; }
.rc-meta{ display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:12px; margin-bottom:12px; }
.rc-meta dt{ color:var(--muted); font-weight:700; }
.rc-meta dd{ margin:0; font-weight:700; text-align:right; }
.rc-items{ border-top:1px solid var(--line); }
.rc-item{ padding:9px 0; border-bottom:1px solid #f3ecf5; font-size:12.5px; }
.rc-item .n{ font-weight:700; }
.rc-item .d{ display:flex; justify-content:space-between; color:var(--muted); font-size:11.5px; margin-top:2px; }
.rc-sums{ padding-top:10px; display:flex; flex-direction:column; gap:5px; font-size:12.5px; }
.rc-sums .r{ display:flex; justify-content:space-between; }
.rc-sums .r.total{ border-top:1px dashed var(--line-2); margin-top:5px; padding-top:9px; font-size:16px; font-weight:800; color:var(--brand); }
.rc-pay{ margin-top:11px; padding-top:10px; border-top:1px dashed var(--line-2); display:flex; flex-direction:column; gap:6px; }
.rc-pay-row{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12px; }
.rc-pay-row .k{ flex:0 0 58px; font-size:10.5px; font-weight:800; letter-spacing:.02em; color:var(--brand-2); }
.rc-pay-row .v{ flex:1 1 140px; font-weight:700; color:var(--ink); word-break:break-all; }
.rc-pay-row .v em{ font-style:normal; font-weight:600; font-size:10.5px; color:var(--muted); }
.rc-pay-row .v.link{ font-weight:500; font-size:11px; color:var(--muted); }
.rc-foot{ margin-top:13px; padding-top:11px; border-top:1px dashed var(--line-2); font-size:10.5px; color:var(--muted); line-height:1.7; text-align:center; }
.copy-note{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:9px; line-height:1.6; }

/* ---------- 관리자 ---------- */
.admin{ display:flex; flex-direction:column; gap:14px; }
.admin-top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.admin-top h1{ font-size:19px; letter-spacing:.02em; }
.admin-top .kicker{ display:block; margin-bottom:2px; }
.admin-top .spacer{ flex:1; }
.atabs{ display:flex; gap:4px; overflow-x:auto; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px; scrollbar-width:none; }
.atabs::-webkit-scrollbar{ display:none; }
.atabs button{
  flex:0 0 auto; border:0; background:none; cursor:pointer;
  padding:9px 14px; border-radius:9px; font-size:13px; font-weight:800; color:var(--muted);
  letter-spacing:-.01em;
}
.atabs button.active{ background:var(--brand-50); color:var(--brand); }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; box-shadow:0 1px 2px rgba(42,27,48,.03); }
.panel-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.panel-head h2{ font-size:15px; letter-spacing:.01em; }
.panel-head .spacer{ flex:1; }
.hint{ font-size:11.5px; color:var(--muted); line-height:1.65; }
.notice{
  display:flex; gap:8px; align-items:flex-start;
  font-size:11.5px; line-height:1.65;
  border-radius:10px; padding:10px 12px;
}
.notice.warn{ background:#fdf7e8; border:1px solid #f0e2c0; color:#7a5a22; }
.notice.info{ background:var(--brand-50); border:1px solid var(--brand-100); color:#4a2b55; }
.notice.danger{ background:var(--danger-50); border:1px solid #eed3ce; color:#8c2b21; }

.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(156px,1fr)); gap:10px; }
.kpi{ border:1px solid var(--line); border-radius:14px; padding:13px 14px; background:var(--surface); }
.kpi .k{ font-size:11px; color:var(--muted); font-weight:800; letter-spacing:.02em; }
.kpi .v{ font-size:21px; font-weight:800; letter-spacing:-.045em; margin-top:3px; font-variant-numeric:tabular-nums; }
.kpi .s{ font-size:11px; color:var(--muted); margin-top:3px; }
.kpi.hero{
  background:radial-gradient(130% 150% at 90% 0%, #6b4477 0%, #5d3969 60%, #3f2450 100%);
  border-color:transparent; color:#fdf8ff;
  box-shadow:0 10px 26px rgba(93,57,105,.22);
}
.kpi.hero .k,.kpi.hero .s{ color:rgba(249,244,251,.72); }
.kpi.pos .v{ color:var(--brand-2); }
.kpi.neg .v{ color:var(--danger); }

.seg-chips{ display:flex; gap:6px; flex-wrap:wrap; }
.seg-chips button{
  border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:6px 12px; font-size:12px; font-weight:800; color:var(--ink-2); cursor:pointer;
  letter-spacing:-.01em;
}
.seg-chips button.active{ background:var(--brand); border-color:var(--brand); color:#fdf8ff; }
.date-range{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.date-range input{ height:34px; border:1px solid var(--line-2); border-radius:8px; padding:0 8px; font-size:12.5px; }

.admin-root, .panel{ min-width:0; max-width:100%; }
.table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%; margin:0; }
table.tbl{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:700px; }
table.tbl th{
  text-align:left; font-size:11px; color:var(--muted); font-weight:800; letter-spacing:.02em;
  padding:8px 10px; border-bottom:1px solid var(--accent-2); white-space:nowrap; background:#fbf7fc;
}
table.tbl td{ padding:9px 10px; border-bottom:1px solid #f3ecf5; vertical-align:middle; word-break:keep-all; }
table.tbl td.num, table.tbl th.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
table.tbl tr:hover td{ background:#fcf9fd; }
table.tbl td .nm{ font-weight:800; letter-spacing:-.02em; }
table.tbl td .sub{ font-size:11px; color:var(--muted); }
.tbl-empty{ padding:28px; text-align:center; color:var(--muted); font-size:12.5px; }
.badge{
  display:inline-block; font-size:10.5px; font-weight:800; padding:2px 7px;
  border-radius:6px; white-space:nowrap; letter-spacing:-.01em;
}
.badge.g{ background:var(--ok-50); color:var(--ok); }
.badge.y{ background:#fdf7e8; color:#7a5a22; border:1px solid #f0e2c0; }
.badge.r{ background:var(--danger-50); color:var(--danger); }
.badge.n{ background:var(--surface-2); color:var(--muted); }
.badge.b{ background:var(--brand-50); color:var(--brand-2); }
.badge.ex{ background:#fdf3f7; color:#9d174d; border:1px solid #f7d4e3; }
.margin-pos{ color:var(--brand-2); font-weight:800; }
.margin-neg{ color:var(--danger); font-weight:800; }

.prod-thumb{
  width:42px; height:42px; border-radius:10px; border:1px solid var(--line);
  object-fit:cover; background:var(--surface-2); display:block;
}
.ph{
  display:grid; place-items:center; text-align:center;
  background:linear-gradient(150deg,#f7f2f9,#f5eef8);
  color:var(--brand-2); font-weight:800; font-size:10.5px; line-height:1.2;
  padding:4px; border-radius:10px; overflow:hidden;
}
.ph.ph-lg{ border-radius:14px; font-size:14px; }

.switch{ display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:12px; font-weight:700; color:var(--ink-2); }
.switch input{ appearance:none; -webkit-appearance:none; width:38px; height:22px; border-radius:999px; background:#d8d0be; position:relative; cursor:pointer; transition:background .16s; flex:0 0 38px; margin:0; }
.switch input::after{ content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .16s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
.switch input:checked{ background:var(--brand-2); }
.switch input:checked::after{ transform:translateX(16px); }

.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-grid .full{ grid-column:1/-1; }
.form-grid .field > label{ font-size:11.5px; }
.form-grid .field input,.form-grid .field textarea,.form-grid .field select{ font-size:13.5px; }
.margin-preview{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--brand-50); border:1px solid var(--brand-100);
  border-radius:10px; padding:10px 12px; font-size:12.5px;
}
.margin-preview b{ font-size:15px; color:var(--brand); letter-spacing:-.02em; }
.img-preview{
  width:100%; aspect-ratio:16/10; border:1px dashed var(--line-2); border-radius:12px;
  background:var(--surface-2); display:grid; place-items:center; overflow:hidden; margin-top:6px;
}
.img-preview img{ width:100%; height:100%; object-fit:contain; }
.img-preview .ph{ width:100%; height:100%; border-radius:0; }

.sync-status{ display:flex; flex-direction:column; gap:4px; font-size:12px; }
.sync-line{ display:flex; align-items:center; gap:7px; }
.dot{ width:8px; height:8px; border-radius:50%; background:#d8d0be; flex:0 0 8px; }
.dot.ok{ background:var(--ok); }
.dot.err{ background:var(--danger); }
.dot.busy{ background:var(--accent); animation:pulse 1s infinite; }
@keyframes pulse{ 50%{ opacity:.35 } }

/* ---------- 판매원 오픈 잠금 (초기 진입 게이트) ---------- */
.toplock{
  display:inline-flex; align-items:center; gap:4px; flex:0 0 auto;
  border:1px solid var(--line-2); background:var(--surface); color:var(--muted);
  font-size:11.5px; font-weight:800; letter-spacing:-.01em;
  padding:5px 10px; border-radius:999px; cursor:pointer;
  transition:color .16s, border-color .16s, background .16s;
}
.toplock:hover{ color:var(--brand); border-color:var(--accent-2); background:var(--brand-50); }
.toplock .lk{ width:11px; height:11px; display:block; flex:0 0 11px; }
body.gate-locked .cart-bar{ display:none !important; }
.seller-gate{
  position:fixed; inset:0; z-index:60; overflow-y:auto;
  display:flex; align-items:center; justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 90% at 50% 0%, #fbf7fc 0%, #f4eff7 45%, #ffffff 100%);
}
.sg-wrap{ width:100%; display:flex; align-items:center; justify-content:center; }
.sg-card{
  width:min(392px,100%); text-align:center;
  background:var(--surface); border:1px solid rgba(203,179,214,.6); border-radius:22px;
  padding:26px 22px 20px; box-shadow:0 18px 48px rgba(93,57,105,.16);
}
.sg-mark{ width:64px; height:64px; margin:0 auto 10px; filter:drop-shadow(0 6px 14px rgba(93,57,105,.22)); }
.sg-mark svg{ display:block; width:100%; height:100%; }
.sg-card h1{ font-size:19px; margin:6px 0 6px; letter-spacing:-.02em; word-break:keep-all; }
.sg-sub{ font-size:12.5px; color:var(--muted); line-height:1.55; }
.sg-sub b{ color:var(--brand); }
.sg-pin{ margin-top:14px; }
.sg-pin input{
  height:52px; text-align:center; font-size:21px; font-weight:800;
  letter-spacing:.42em; text-indent:.42em; color:var(--ink);
}
.sg-msg{ margin-top:8px; min-height:16px; color:var(--danger); font-size:12px; font-weight:700; }
.sg-card .btn.block{ margin-top:12px; }
.sg-foot{ margin-top:14px; font-size:10.5px; line-height:1.6; color:var(--muted); }
.sg-foot b{ color:var(--ink-2); font-weight:700; }
.sg-back{ margin-top:10px; }

/* 토스트 */
.toast-root{ position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:calc(100% - 32px); max-width:420px; }
.toast{
  background:rgba(93,57,105,.96); color:#fdf8ff; font-size:12.5px; font-weight:700;
  padding:10px 16px; border-radius:999px; box-shadow:var(--shadow-lg);
  animation:toastIn .2s ease; text-align:center; line-height:1.45;
  border:1px solid rgba(203,179,214,.35);
}
@keyframes toastIn{ from{ transform:translateY(8px); opacity:0 } to{ transform:none; opacity:1 } }

/* 인쇄 */
#printArea{ display:none; }
@media print{
  body{ background:#fff; }
  #app, #modalRoot, #toastRoot, .cart-bar{ display:none !important; }
  #printArea{ display:block !important; padding:0; }
  .print-doc{ font-size:12.5px; line-height:1.6; color:#111; }
  .print-doc .doc-head{ text-align:center; border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:12px; }
  .print-doc .doc-head .mark{ width:32px; height:32px; margin:0 auto 4px; }
  .print-doc h1{ font-size:18px; text-align:center; margin:0 0 2px; letter-spacing:.06em; }
  .print-doc .center{ text-align:center; color:#555; font-size:11px; margin-bottom:0; }
  .print-doc table{ width:100%; border-collapse:collapse; margin:10px 0; font-size:11.5px; }
  .print-doc th,.print-doc td{ border-bottom:1px solid #ddd; padding:6px 4px; text-align:left; }
  .print-doc td.num,.print-doc th.num{ text-align:right; }
  .print-doc .sums{ width:100%; margin-top:8px; font-size:12px; }
  .print-doc .sums td{ border:0; padding:3px 4px; }
  .print-doc .sums .total td{ border-top:1px solid #333; font-weight:800; font-size:14px; padding-top:6px; }
  .print-doc footer{ margin-top:16px; font-size:10px; color:#666; text-align:center; line-height:1.6; }
}

/* ---------- 재고 · 본점 모니터링 ---------- */
.stock-tag{
  flex:0 0 auto; align-self:flex-start; white-space:nowrap;
  font-size:10px; font-weight:800; letter-spacing:-.01em; line-height:1.35;
  padding:2px 7px; border-radius:6px;
  background:#fdf7e8; border:1px solid #f0e2c0; color:#7a5a22;
}
.stock-tag.out{ border-color:#eed3ce; color:var(--danger); }
.stock-inline{ font-size:11px; color:var(--muted); }
.stock-inline b{ color:var(--ink-2); }
.badge.low{ background:#fdf7e8; color:#7a5a22; border:1px solid #f0e2c0; }
.badge.out{ background:var(--danger-50); color:var(--danger); border:1px solid #eed3ce; }
.badge.ok{ background:#eef7f1; color:#22643c; border:1px solid #cfe8d8; }

.stock-filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 10px; }
.stock-filters select,.stock-filters input{
  height:34px; border:1px solid var(--line-2); border-radius:8px;
  font-size:12.5px; padding:0 9px; background:var(--surface); color:var(--ink);
  max-width:100%;
}
.stock-filters input[type="search"]{ min-width:140px; flex:1 1 140px; }
.stock-row-actions{ display:flex; gap:4px; flex-wrap:nowrap; }
.stock-row-actions .btn{ padding:0 8px; }

/* 재고 목록 — 표 대신 줄 단위 목록(모바일에서 가로 스크롤 없음) */
.stock-list,.hist-list{ display:flex; flex-direction:column; }
.stock-item{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px;
  align-items:center; padding:11px 2px; border-bottom:1px solid #f3ecf5;
}
.si-head{ display:flex; align-items:center; gap:7px; min-width:0; flex-wrap:wrap; }
.si-name{ font-size:13px; font-weight:800; letter-spacing:-.02em; }
.si-meta{ grid-column:1/2; font-size:11px; color:var(--muted); line-height:1.5; }
.si-nums{ grid-column:1/2; display:flex; gap:14px; align-items:baseline; font-size:11.5px; color:var(--muted); }
.si-nums b{ font-size:15px; color:var(--ink); letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.si-actions{ grid-column:2/3; grid-row:1/3; display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
.si-actions .btn{ padding:0 9px; }
.hist-item{ display:flex; flex-direction:column; gap:2px; padding:10px 2px; border-bottom:1px solid #f3ecf5; }
.hi-top{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--muted); }
.hi-main{ font-size:12.5px; font-weight:700; letter-spacing:-.01em; }
.hi-main .sub{ font-weight:600; margin-left:4px; }
.hi-nums{ font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.hi-nums b{ font-size:12.5px; }
.hist-delta.pos{ color:#22643c; font-weight:800; }
.hist-delta.neg{ color:var(--danger); font-weight:800; }
.list-empty{ padding:26px 8px; text-align:center; color:var(--muted); font-size:12.5px; }
/* 데스크톱은 한 줄에 품목 · 수량 · 버튼을 나란히 */
@media (min-width: 641px){
  .stock-item{ grid-template-columns:minmax(0,1fr) auto auto; }
  .si-head{ grid-column:1/2; grid-row:1/2; }
  .si-meta{ grid-column:1/2; grid-row:2/3; }
  .si-nums{ grid-column:2/3; grid-row:1/3; justify-content:flex-end; padding-right:10px; }
  .si-actions{ grid-column:3/4; grid-row:1/3; }
}
@media (max-width: 640px){
  .stock-item{ grid-template-columns:minmax(0,1fr); gap:3px; }
  .si-actions{ grid-column:1/2; grid-row:auto; justify-content:flex-start; margin-top:4px; }
}

.mon-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(184px,1fr)); gap:10px; }
.mon-card{
  border:1px solid var(--line); border-radius:14px; padding:13px 14px;
  background:var(--surface); display:flex; flex-direction:column; gap:2px; min-width:0;
}
.mon-card.hero{
  background:radial-gradient(130% 150% at 90% 0%, #6b4477 0%, #5d3969 60%, #3f2450 100%);
  border-color:transparent; color:#fdf8ff; box-shadow:0 10px 26px rgba(93,57,105,.22);
}
.mon-card .mc-top{ display:flex; align-items:center; gap:7px; }
.mon-card .mc-name{ font-size:12.5px; font-weight:800; letter-spacing:-.02em; }
.mon-card .mc-rev{ font-size:20px; font-weight:800; letter-spacing:-.045em; font-variant-numeric:tabular-nums; margin-top:3px; }
.mon-card .mc-meta{ font-size:11px; color:var(--muted); display:flex; gap:9px; flex-wrap:wrap; margin-top:2px; }
.mon-card.hero .mc-meta{ color:rgba(249,244,251,.76); }
.mon-card .mc-bar{ height:4px; border-radius:99px; background:var(--surface-2); margin-top:8px; overflow:hidden; }
.mon-card.hero .mc-bar{ background:rgba(253,248,255,.24); }
.mon-card .mc-bar i{ display:block; height:100%; border-radius:99px; background:var(--brand-2); }
.mon-card.hero .mc-bar i{ background:#e2c9ee; }
.mon-feed{ display:flex; flex-direction:column; }
.feed-item{
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:3px 9px;
  align-items:center; padding:10px 2px; border-bottom:1px solid #f3ecf5;
  cursor:pointer; text-align:left; background:none; border-left:0; border-right:0; border-top:0; width:100%;
}
.feed-item:hover{ background:#fcf9fd; }
.feed-item .fi-time{ font-size:10.5px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.feed-item .fi-main{ min-width:0; }
.feed-item .fi-no{ font-size:11px; font-weight:800; color:var(--brand-2); letter-spacing:-.01em; }
.feed-item .fi-items{ font-size:11.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.feed-item .fi-right{ text-align:right; white-space:nowrap; }
.feed-item .fi-amt{ font-size:13px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.feed-item .fi-pay{ font-size:10px; color:var(--muted); }
.feed-item .fi-badges{ grid-column:1/-1; display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
.feed-empty{ padding:26px 8px; text-align:center; color:var(--muted); font-size:12.5px; }
.mon-status{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); }
.mon-status .dot{ flex:0 0 8px; }
@media (max-width: 520px){
  .panel{ padding:13px; }
  .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .kpi{ padding:11px 12px; }
  .kpi .v{ font-size:18px; }
  .kpi .k{ font-size:10.5px; }
  .mon-cards{ grid-template-columns:1fr 1fr; }
  .mon-card.hero{ grid-column:1/-1; }
  .mon-card .mc-rev{ font-size:17px; }
  .stock-row-actions{ flex-wrap:wrap; }
}

/* ---------- 반응형 ---------- */
@media (max-width: 960px){
  .cust-layout{ grid-template-columns:minmax(0,1fr); }
  .cart-panel{
    position:fixed; left:0; right:0; bottom:0; top:auto; z-index:65;
    max-height:92vh; overflow:hidden; border-radius:24px 24px 0 0;
    transform:translateY(102%);
    transition:transform .26s cubic-bezier(.22,.8,.3,1);
    box-shadow:0 -20px 50px rgba(42,27,48,.28);
    padding-bottom:env(safe-area-inset-bottom);
  }
  body.sheet-open .cart-panel{ transform:translateY(0); }
  .cart-scroll{ max-height:none; flex:1 1 auto; }
  body.sheet-open::after{
    content:""; position:fixed; inset:0; background:rgba(42,27,48,.44); z-index:60;
    animation:fade .2s ease;
  }
  .cart-head .icon-btn{ display:inline-flex; }
  .cart-bar{ display:flex; }
  body.admin-mode .cart-bar{ display:none !important; }
  .app{ padding-bottom:calc(98px + env(safe-area-inset-bottom)); }
  .grid, .line-grid{ grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:10px; }
  .line-sec + .line-sec{ margin-top:16px; }
  .line-head{ margin-bottom:8px; }
  .line-head h2{ font-size:14px; }
  .card-body{ padding:9px 10px 11px; }
  .card h3{ font-size:12.5px; }
  .card .card-sum{ font-size:11px; }
  .price{ font-size:15px; }
  .add-btn{ padding:0 9px; font-size:11.5px; min-height:34px; }
  .hero{ padding:18px 18px 16px; border-radius:20px; }
  .hero-title{ font-size:22px; letter-spacing:.14em; }
  .hero-copy{ font-size:12px; }
  .modal-backdrop{ padding:0; align-items:flex-end; }
  .modal{ width:100%; max-height:94vh; border-radius:22px 22px 0 0; }
  .modal.wide{ width:100%; }
  .detail-media{ aspect-ratio:1/1; }
  .form-grid{ grid-template-columns:1fr; }
  .admin-top h1{ font-size:17px; }
}
@media (max-width: 520px){
  .leaf-hero{ padding:14px 16px 13px; }
  .leaf-body{ padding:14px 16px 10px; }
  .leaf-name{ font-size:18px; }
  .leaf-info-row{ grid-template-columns:1fr; padding:8px 0 10px; }
  .leaf-info dt{ background:transparent; padding:0 10px 3px; font-size:11px; }
  .leaf-info dd{ padding:0 10px; }
}
@media (max-width: 420px){
  .grid, .line-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .modes button{ padding:7px 10px; font-size:12px; }
  .brand-name{ font-size:15px; }
  .app{ padding-left:14px; padding-right:14px; }
  .modal-foot .detail-qty .qty button{ width:30px; }
  .modal-foot .btn{ padding:0 12px; font-size:13px; }
  .topbar-inner{ padding-left:14px; padding-right:14px; }
  .toplock{ padding:5px 8px; }
  .toplock .txt{ display:none; }
}
@media (min-width: 961px){
  body.sheet-open::after{ content:none; }
}

<!-- 제품 설명서(리플렛) 원문 데이터 — 같은 폴더에 두면 상품 상세에서 설명서가 열립니다.

<script src="leaflet-data.js"></script>
<script>
/* =========================================================================
   지쿱 POS — 애플리케이션 스크립트 (외부 CSS/CDN 의존 없음, ES5+ 브라우저 지원)
   · leaflet-data.js 는 선택 데이터 파일(제품 설명서 원문). 없으면 설명서 기능만 빠진다.
   구조
     1) 상수 · 유틸리티(순수 함수)
     2) 저장소(localStorage)  ─ 공개 저장소 / 비밀 저장소 분리
     3) 초기 상품 데이터(지쿱 공식몰 확인값)
     4) 고객 화면 렌더링 · 장바구니 · 주문 · 영수증
     5) 관리자 화면(정산 · 품목 · 주문 · 동기화/설정)
     6) 부팅
   ========================================================================= */
(function () {
  'use strict';

  /* ============ 1) 상수 ============ */
  var APP_VERSION = '1.2.0';
  var LS_PUB = 'gcoop-pos.v1.pub';   // 고객에게 보이는 데이터만 (매입가·마진·PIN 없음)
  var LS_SEC = 'gcoop-pos.v1.sec';   // 판매자 전용 데이터 (PIN 해시·매입가·주문원가·판매원 비밀번호)
  var LS_SESSION = 'gcoop-pos.v1.sellerSession';  // 같은 탭(sessionStorage) 안에서만 유지되는 판매원 잠금 해제 표시
  var SELLER_PIN_DEFAULT = '1111';   // 판매원 오픈 비밀번호 초기값 (관리자 PIN 0000과 별개)

  var CHANNELS = [
    { v: 'offline', label: '오프라인(대면)' },
    { v: 'online', label: '온라인 주문' }
  ];
  var PAYMENTS = [
    { v: 'cash', label: '현금' },
    { v: 'bank', label: '계좌이체' },
    { v: 'card', label: '단말기 카드' },
    { v: 'gcoop', label: '지쿱몰 링크' }
  ];
  var STATUSES = [
    { v: 'received', label: '접수', tone: 'y' },
    { v: 'paid', label: '결제완료', tone: 'b' },
    { v: 'done', label: '배송/수령완료', tone: 'g' },
    { v: 'refunded', label: '환불', tone: 'r' },
    { v: 'canceled', label: '취소', tone: 'r' }
  ];
  /* 재고를 되돌리는 상태(취소·환불) — 정산에서도 뺀다. */
  function isClosedStatus(v) { return v === 'canceled' || v === 'refunded'; }

  /* ============ 1-1) 숫자·문자 유틸 ============ */
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = String(v == null ? '' : v).replace(/,/g, '').trim();
    if (!s) return 0;
    var n = Number(s);
    return isFinite(n) ? n : 0;
  }
  function int(v) { return Math.round(num(v)); }
  function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function groupNum(v) {
    var n = int(v);
    var neg = n < 0;
    var str = String(Math.abs(n));
    var out = '';
    for (var i = 0; i < str.length; i++) {
      if (i > 0 && (str.length - i) % 3 === 0) out += ',';
      out += str.charAt(i);
    }
    return (neg ? '-' : '') + out;
  }
  function fmtWon(n) { return groupNum(n) + '원'; }
  function fmtWonShort(n) {
    var v = int(n);
    if (Math.abs(v) >= 100000000) return (v / 100000000).toFixed(1).replace(/\.0$/, '') + '억원';
    if (Math.abs(v) >= 10000) return groupNum(Math.round(v / 10000)) + '만원';
    return groupNum(v) + '원';
  }
  function fmtPct(n) {
    var v = Math.round(num(n) * 10) / 10;
    return (v > 0 ? '+' : '') + v.toFixed(1) + '%';
  }
  function fmtDate(ts) {
    var d = new Date(num(ts));
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function fmtTime(ts) {
    var d = new Date(num(ts));
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function fmtDateTime(ts) { return fmtDate(ts) + ' ' + fmtTime(ts); }
  function dayStart(ts) {
    var d = new Date(num(ts));
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }
  function addDays(ts, days) {
    var d = new Date(num(ts));
    d.setDate(d.getDate() + days);
    return d.getTime();
  }
  function todayInput() { return fmtDate(Date.now()); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function nl2br(s) { return esc(s).replace(/\n/g, '<br>'); }
  function uid(prefix) {
    var t = Date.now().toString(36);
    var r = Math.random().toString(36).slice(2, 6);
    return (prefix || 'id') + '-' + t + '-' + r;
  }
  function orderNo(ts) {
    var d = new Date(num(ts) || Date.now());
    var base = String(d.getFullYear()).slice(2) + pad2(d.getMonth() + 1) + pad2(d.getDate());
    var prefix = 'DB-' + base + '-';
    var legacyPrefix = 'GC-' + base + '-';
    var maxSeq = 0;
    var list = (state.pub && state.pub.orders) ? state.pub.orders : [];
    for (var i = 0; i < list.length; i++) {
      var no = String((list[i] && list[i].no) || '');
      if (no.indexOf(prefix) === 0 || no.indexOf(legacyPrefix) === 0) {
        var tail = parseInt(no.slice(prefix.length), 10);
        if (!isNaN(tail) && tail > 0 && tail < 1000 && tail > maxSeq) maxSeq = tail;
      }
    }
    var s = String(maxSeq + 1);
    while (s.length < 3) s = '0' + s;
    return prefix + s;
  }
  function digitsOnly(s) { return String(s == null ? '' : s).replace(/[^0-9]/g, ''); }

  /* ============ 1-2) 계산 로직 (테스트 대상) ============ */
  /**
   * 마진 계산: 소비자가 - 매입가
   * @returns {{margin:number, rate:number}} rate 는 소비자가 대비 % (소수 1자리)
   */
  function calcMargin(price, cost) {
    var p = num(price), c = num(cost);
    var margin = p - c;
    var rate = p > 0 ? (margin / p) * 100 : 0;
    return { margin: Math.round(margin), rate: Math.round(rate * 10) / 10 };
  }

  /**
   * 할인 적용: {type:'none'|'amount'|'percent', value}
   * 정률은 소계 기준으로 반올림, 할인액은 소계를 넘지 않는다.
   */
  function applyDiscount(subtotal, discount) {
    var sub = Math.max(0, int(subtotal));
    var d = discount || {};
    var amt = 0;
    if (d.type === 'amount') amt = int(d.value);
    else if (d.type === 'percent') amt = Math.round(sub * clamp(num(d.value), 0, 100) / 100);
    amt = clamp(amt, 0, sub);
    return { subtotal: sub, discount: amt, total: sub - amt };
  }

  /**
   * 장바구니 합계: lines = [{price, qty}]
   * @returns {{subtotal, discount, total, qty, count, lines:[{price,qty,amount}]}}
   */
  function calcCartTotals(lines, discount) {
    var list = Array.isArray(lines) ? lines : [];
    var subtotal = 0, qty = 0, out = [];
    for (var i = 0; i < list.length; i++) {
      var p = int(list[i].price);
      var q = Math.max(0, int(list[i].qty));
      var amount = p * q;
      subtotal += amount;
      qty += q;
      out.push({ price: p, qty: q, amount: amount });
    }
    var sums = applyDiscount(subtotal, discount);
    return {
      subtotal: sums.subtotal,
      discount: sums.discount,
      total: sums.total,
      qty: qty,
      count: out.length,
      lines: out
    };
  }

  /* ============ 1-3) CSV ============ */
  function csvCell(v) {
    var s = (v == null) ? '' : String(v);
    // 엑셀 수식 주입 방지 (=, +, @, 탭, CR 로 시작하거나 숫자가 아닌 '-' 로 시작)
    if (/^[=+@\t\r]/.test(s)) s = "'" + s;
    else if (s.charAt(0) === '-' && !/^-?\d+(\.\d+)?$/.test(s)) s = "'" + s;
    if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function toCSV(rows) {
    return (rows || []).map(function (r) {
      return r.map(csvCell).join(',');
    }).join('\r\n');
  }

  /* ============ 1-4) PIN 해시 ============ */
  function fnv1a(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h >>> 0;
  }
  function hashPin(pin, salt) {
    var s = String(salt || '') + '|' + String(pin || '') + '|gcoop-pos';
    var h = fnv1a(s);
    for (var i = 0; i < 300; i++) {
      h = fnv1a(h.toString(36) + s + i);
    }
    return h.toString(16);
  }
  function randomSalt() {
    var s = '';
    try {
      if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
        var a = new Uint32Array(4);
        crypto.getRandomValues(a);
        for (var i = 0; i < a.length; i++) s += a[i].toString(36);
      }
    } catch (e) { /* noop */ }
    if (!s) s = Date.now().toString(36) + Math.random().toString(36).slice(2);
    return s;
  }

  /* ============ 2) 저장소 ============ */
  var memStore = {};
  function store() {
    try {
      if (typeof window !== 'undefined' && window.localStorage) {
        var k = '__gcoop_probe__';
        window.localStorage.setItem(k, '1');
        window.localStorage.removeItem(k);
        return window.localStorage;
      }
    } catch (e) { /* 사파리 프라이빗 모드 등 */ }
    return {
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null; },
      setItem: function (k, v) { memStore[k] = String(v); },
      removeItem: function (k) { delete memStore[k]; }
    };
  }
  function readJSON(key, fallback) {
    try {
      var raw = store().getItem(key);
      if (!raw) return fallback;
      var o = JSON.parse(raw);
      return (o && typeof o === 'object') ? o : fallback;
    } catch (e) { return fallback; }
  }
  function writeJSON(key, value) {
    try { store().setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }

  var state = {
    pub: null,   // 공개 데이터 (상품·주문·공개 설정)
    sec: null,   // 비밀 데이터 (PIN·매입가·주문 원가)
    ui: {
      mode: 'customer',
      adminUnlocked: false,
      tab: 'settle',
      category: '전체',
      query: '',
      cart: [],                 // [{id, qty}]
      channel: 'offline',
      payment: 'cash',
      discount: { type: 'none', value: 0 },
      period: 'today',
      from: '', to: '',
      prodQuery: '',
      orderStatus: 'all',
      orderQuery: '',
      detailId: null,
      detailQty: 1,
      leafId: null,             // 제품 설명서(리플렛)를 열어 둔 품목
      leafQty: 0,               // 설명서에서 상세로 돌아갈 때 되살릴 수량
      monPeriod: 'today',
      monBranch: 'all',
      monBusy: false,
      monMsg: '',
      stockBranch: '',
      stockCat: 'all',
      stockState: 'all',
      stockQuery: '',
      stockHistBranch: 'all',
      stockHistType: 'all',
      stockForm: null,
      editingId: null,
      syncBusy: false,
      syncMsg: '',
      syncOk: null
    }
  };

  function defaultPub() {
    return {
      version: 1,
      settings: {
        shopName: '다시봄',
        subtitle: '온·오프라인 판매 POS',
        branches: [
          { id: 'b-main', name: '본점', type: 'offline' },
          { id: 'b-dongtan', name: '동탄점', type: 'offline' },
          { id: 'b-online', name: '온라인몰', type: 'online' }
        ],
        defaultBranchId: 'b-main',
        currentBranchId: 'b-main',
        managerName: '',
        deviceName: '',
        syncUrl: '',
        autoSync: false,
        autoSyncSec: 60,
        lastSyncAt: 0,
        lastSyncNote: '',
        priceNote: '소비자가는 2026-11-24 지쿱 공식몰(vcshop.gcoop.com) 확인값입니다.',
        pay: { bank: '', account: '', holder: '', link: '' }
      },
      products: [],
      orders: [],
      /* 지점별·품목별 재고 — { [branchId]: { [productId]: { qty, safetyQty, updatedAt } } }
         재고 구조가 없는 예전 저장소도 loadAll() 에서 현재 지점 재고를 자동으로 만들어 준다. */
      inventory: {},
      /* 입출고 이력 — 시간순(오래된 순)으로 쌓고, 조회는 최신순으로 한다. */
      stockLogs: [],
      stockVersion: STOCK_VERSION
    };
  }
  function defaultSec() {
    return {
      version: 1,
      pin: { salt: '', hash: '' },
      /* 판매원 오픈 잠금 — 페이지를 열 때 판매원 비밀번호를 먼저 묻는다.
         · enabled: 잠금 사용 여부 (기본 켜짐)
         · salt/hash: 공통 판매원 비밀번호 (초기 1111, 해시로만 저장)
         · branches: { 지점id: {salt, hash} } — 비어 있으면 공통 비밀번호를 쓴다 */
      seller: { enabled: true, salt: '', hash: '', isDefault: true, branches: {}, updatedAt: 0 },
      costs: {},          // { productId: 매입가 }
      costExample: {},    // { productId: true } → [예시] 표시
      orderCosts: {},     // { orderId: { total, items:{pid:단가}, at } }
      meta: { createdAt: 0 }
    };
  }

    for (var i = 0; i < CHANNELS.length; i++) if (CHANNELS[i].v === v) return CHANNELS[i].label;
    return v || '';
  }
  function paymentLabel(v) {
    for (var i = 0; i < PAYMENTS.length; i++) if (PAYMENTS[i].v === v) return PAYMENTS[i].label;
    return v || '';
  }
  function statusMeta(v) {
    for (var i = 0; i < STATUSES.length; i++) if (STATUSES[i].v === v) return STATUSES[i];
    return { v: v, label: v || '', tone: 'n' };
  }

  /* ---- 입금 계좌 · 송금 링크 (공개해도 되는 결제 안내) ---- */
  function paySettings() {
    var s = (state.pub && state.pub.settings) || {};
    var p = s.pay || {};
    return {
      bank: String(p.bank || '').trim(),
      account: String(p.account || '').trim(),
      holder: String(p.holder || '').trim(),
      link: String(p.link || '').trim()
    };
  }
  function safeTransferLink(url) {
    var u = String(url || '').trim();
    if (!u) return '';
    if (!/^https:\/\//i.test(u)) return '';
    if (/[\s<>"']/.test(u)) return '';
    return u;
  }
  function accountLine() {
    var p = paySettings();
    if (!p.account) return '';
    return (p.bank ? p.bank + ' ' : '') + p.account + (p.holder ? ' (예금주 ' + p.holder + ')' : '');
  }
  function openTransferLink() {
    var url = safeTransferLink(paySettings().link);
    if (!url) { toast('송금 링크가 https:// 주소가 아닙니다. 설정에서 확인해 주세요.'); return; }
    try { if (typeof window !== 'undefined' && window.open) window.open(url, '_blank', 'noopener'); } catch (e) { /* noop */ }
  }
  function copyAccount() {
    var p = paySettings();
    if (!p.account) return;
    var digits = p.account.replace(/[^0-9]/g, '') || p.account;
    copyText(digits).then(function (ok) {
      if (ok) toast('계좌번호를 복사했습니다.');
      else showCopyFallback(p.account);
    });
  }
  function payBlockHTML() {
    var p = paySettings();

    var html = '<div class="rc-pay">';

        '<span class="v">' + esc((p.bank ? p.bank + ' ' : '') + p.account) + (p.holder ? ' <em>예금주 ' + esc(p.holder) + '</em>' : '') + '</span>' +
        '<button type="button" class="btn xs" data-act="rc:copyacct">계좌번호 복사</button></div>';

        '<button type="button" class="btn xs gold" data-act="rc:openlink">송금 링크로 바로 보내기</button></div>';
    }
    html += '</div>';
    return html;
  }

  function buildReceiptText(order, shopName) {
    var shop = shopName || '지쿱';
    var lines = [];
    var items = (order && order.items) || [];
    lines.push('[' + shop + (order && order.branchName ? ' ' + order.branchName : '') + '] 주문 확인서');
    lines.push('주문번호: ' + (order.no || order.id || ''));
    lines.push('주문일시: ' + fmtDateTime(order.ts));
    lines.push('------------------------------');
    items.forEach(function (it, i) {
      var qty = Math.max(1, int(it.qty));
      lines.push((i + 1) + '. ' + it.name);
      lines.push('   ' + fmtWon(it.price) + ' x ' + qty + ' = ' + fmtWon(int(it.price) * qty));
    });
    lines.push('------------------------------');
    lines.push('소계: ' + fmtWon(order.subtotal));
    if (int(order.discount && order.discount.amount) > 0) {
      lines.push('할인: -' + fmtWon(order.discount.amount));
    }
    lines.push('합계: ' + fmtWon(order.total));
    lines.push('결제: ' + paymentLabel(order.payment) + ' / ' + channelLabel(order.channel));
    if (order.branchName) lines.push('지점: ' + shop + ' ' + order.branchName);
    var c = order.customer || {};
    if (c.name) lines.push('고객: ' + c.name);
    if (c.phone) lines.push('연락처: ' + c.phone);
    if (c.address) lines.push('배송지: ' + c.address);
    if (c.memo) lines.push('메모: ' + String(c.memo).replace(/\n/g, ' '));
    var pay = paySettings();
    var link = safeTransferLink(pay.link);
    if (pay.account || link) {
      lines.push('------------------------------');
      if (pay.account) lines.push('입금 계좌: ' + accountLine());
      if (link) lines.push('송금 링크: ' + link);
    }
    lines.push('------------------------------');
    lines.push('이용해 주셔서 감사합니다.');
    return lines.join('\n');
  }

  function buildShortText(order, shopName) {
    var shop = shopName || '지쿱';
    var items = (order && order.items) || [];
    var first = items.length ? items[0].name : '';
    var more = items.length > 1 ? ' 외 ' + (items.length - 1) + '건' : '';
    var pay = paySettings();
    var link = safeTransferLink(pay.link);
    var payTail = '';
    if (pay.account) payTail += '\n입금 ' + accountLine();
    if (link) payTail += '\n' + link;
    return '[' + shop + (order && order.branchName ? ' ' + order.branchName : '') + '] 주문 ' + (order.no || '') + '\n' +
      first + more + '\n합계 ' + fmtWon(order.total) + ' / ' + paymentLabel(order.payment) + payTail;
  }

  /* ============ 4-1) 지점 ============ */
  function branchList() {

  }
  function branchById(id) {
    var list = branchList();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function currentBranch() {
    var s = state.pub.settings;

  }

  }
  function setBranch(id, opts) {
