  function backupSnapshot(note) {
    writeJSON('gcoop-pos.v1.backup', {
      at: Date.now(), note: note || '',
      pub: state.pub, sec: state.sec
    });
  }
  function exportBackup() {
    downloadFile('다시봄_POS_백업_' + todayInput() + '.json',
      JSON.stringify({ app: 'dashibom-pos', version: 1, exportedAt: new Date().toISOString(), pub: state.pub, sec: state.sec }, null, 2),
      'application/json');
    toast('백업 파일을 만들었습니다. (매입가 포함 — 안전하게 보관하세요)');
  }
  function restoreBackup() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.onchange = function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(String(reader.result));
          if (!data || !data.pub || !Array.isArray(data.pub.products)) throw new Error('형식이 다릅니다.');
          if (!window.confirm('백업 파일의 데이터로 덮어쓸까요?\n현재 데이터는 백업 스냅샷으로 보관됩니다.')) return;
          backupSnapshot('복원 전');
          state.pub = data.pub;
          state.sec = data.sec || defaultSec();
          saveAll();
          closeModal();
          toast('복원했습니다.');
          renderAdmin();
          renderCustomer();
        } catch (e) { toast('복원 실패: ' + (e.message || '파일을 읽을 수 없습니다.')); }
      };
      reader.readAsText(f);
    };
    input.click();
  }
  function seedAgain() {
    if (!window.confirm('기본 샘플 품목 중 없는 항목을 다시 추가할까요?\n기존에 수정한 품목은 그대로 둡니다.')) return;
    var seeds = seedProducts();
    var costs = seedCosts();
    var ex = seedCostExample();
    var added = 0;
    seeds.forEach(function (p) {
      if (!productById(p.id)) {
        state.pub.products.push(p);
        state.sec.costs[p.id] = costs[p.id];
        if (ex[p.id]) state.sec.costExample[p.id] = true;
        added++;
      }
    });
    saveAll();
    toast(added ? added + '개 품목을 추가했습니다.' : '추가할 샘플 품목이 없습니다.');
    renderAdminTab();
  }
  function resetAll() {
    if (!window.confirm('모든 품목·주문·설정을 지우고 처음 상태로 되돌립니다.\n계속할까요?')) return;
    if (!window.confirm('정말 초기화할까요? 이 작업은 되돌릴 수 없습니다. (백업 파일이 있으면 복원할 수 있습니다)')) return;
    state.pub = defaultPub();
    state.pub.products = seedProducts();
    state.sec = defaultSec();
    var salt = randomSalt();
    state.sec.pin = { salt: salt, hash: hashPin('0000', salt), isDefault: true };
    state.sec.costs = seedCosts();
    state.sec.costExample = seedCostExample();
    state.sec.meta = { createdAt: Date.now() };
    /* 판매원 오픈 잠금도 초기값(켜짐 · 비밀번호 '1111')으로 돌아간다 */
    var spSalt = randomSalt();
    state.sec.seller = {
      enabled: true, salt: spSalt, hash: hashPin(SELLER_PIN_DEFAULT, spSalt),
      isDefault: true, branches: {}, updatedAt: Date.now()
    };
    writeSess(LS_SESSION, null);
    state.ui.adminUnlocked = false;
    saveAll();
    closeModal();
    setMode('customer');
    toast('초기화했습니다.');
  }

  /* ============ 5-3) PIN 잠금 ============ */
  var pinFail = { count: 0, until: 0 };

  function openPinGate() {
    openModal('<div class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="pinTitle">' +
      '<div class="modal-head"><h2 id="pinTitle">관리자 잠금</h2>' +
      '<button type="button" class="icon-btn" data-act="modal:close" aria-label="닫기">✕</button></div>' +
      '<div class="modal-body">' +
      '<p class="hint" style="margin-bottom:10px">관리자 화면은 PIN으로 보호됩니다.</p>' +
      '<div class="field"><label for="pinInput">PIN</label>' +
      '<input type="password" id="pinInput" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••" style="letter-spacing:.4em;text-align:center;font-size:19px;height:48px"></div>' +
      '<p class="hint" id="pinMsg" style="margin-top:8px;min-height:16px"></p>' +
      '</div>' +
      '<div class="modal-foot"><button type="button" class="btn" data-act="modal:close">취소</button><span class="grow"></span>' +
      '<button type="button" class="btn primary" data-act="pin:ok">확인</button></div></div>', { noFocus: true });
    var inp = $('#pinInput');
    if (inp) { try { inp.focus(); } catch (e) { /* noop */ } }
  }

  function submitPin() {
    var inp = $('#pinInput');
    if (!inp) return;
    var now = Date.now();
    if (pinFail.until > now) {
      var waitMsg = $('#pinMsg');
      if (waitMsg) waitMsg.textContent = '잠시 후 다시 시도해 주세요. (' + Math.ceil((pinFail.until - now) / 1000) + '초)';
      return;
    }
    var pin = digitsOnly(inp.value);
    if (hashPin(pin, state.sec.pin.salt) === state.sec.pin.hash) {
      pinFail = { count: 0, until: 0 };
      state.ui.adminUnlocked = true;
      closeModal();
      setMode('admin');
      return;
    }
    pinFail.count++;
    if (pinFail.count >= 5) { pinFail.until = now + 30000; pinFail.count = 0; }
    inp.value = '';
    var msg = $('#pinMsg');
    if (msg) msg.textContent = 'PIN이 맞지 않습니다.';
  }

  /* ============ 6) 모드 전환 · 이벤트 · 부팅 ============ */
  function setMode(mode) {
    if (mode === 'admin' && !state.ui.adminUnlocked) { openPinGate(); return; }
    state.ui.mode = mode;
    if (typeof document !== 'undefined' && document.body && document.body.classList) document.body.classList.toggle('admin-mode', mode === 'admin');
    var cv = $('#customerView');
    var ar = $('#adminRoot');
    if (mode === 'admin') {
      pushNav('admin');
      if (cv) cv.hidden = true;
      renderAdmin();
    } else {
      state.ui.adminUnlocked = false;
      if (ar) { ar.hidden = true; ar.innerHTML = ''; }
      if (cv) cv.hidden = false;
      renderCustomer();
    }
    var mc = $('#modeCustomer'), ma = $('#modeAdmin');
    if (mc) { mc.classList.toggle('active', mode === 'customer'); mc.setAttribute('aria-pressed', String(mode === 'customer')); }
    if (ma) { ma.classList.toggle('active', mode === 'admin'); ma.setAttribute('aria-pressed', String(mode === 'admin')); }
    window.scrollTo(0, 0);
  }

  function val(sel) {
    var el = $(sel);
    return el ? String(el.value || '') : '';
  }
  function extend(a, b) {
    for (var k in b) if (Object.prototype.hasOwnProperty.call(b, k)) a[k] = b[k];
    return a;
  }

  function bindEvents() {
    document.addEventListener('click', function (e) {
      var t = e.target;
      var el = t && t.closest ? t.closest('[data-act]') : null;
      if (!el) return;
      var act = el.getAttribute('data-act');
      var id = el.getAttribute('data-id');

      switch (act) {
        case 'modal:close': closeModal(); break;
        case 'branch:open': openBranchPicker(); break;
        case 'branch:set': setBranch(id); closeModal(); break;
        case 'cat': state.ui.category = el.getAttribute('data-cat'); renderCats(); renderGrid(); break;
        case 'add': addToCart(id, 1); break;
        case 'detail': openDetail(id); break;
        case 'leaf:open': openLeaflet(id); break;
        case 'leaf:back': leafletBack(); break;
        case 'qty': changeQty(id, int(el.getAttribute('data-d'))); break;
        case 'remove': removeFromCart(id); break;
        case 'dqty': {
          var p = productById(state.ui.detailId);
          var st = p ? availableQty(p) : 0;
          state.ui.detailQty = clamp(state.ui.detailQty + int(el.getAttribute('data-d')), 1, st > 0 ? st : 99);
          updateDetailTotal();
          break;
        }
        case 'detail:add': {
          var q = state.ui.detailQty;
          closeModal();
          addToCart(id, q);
          break;
        }
        case 'rc:copy': copyReceipt(id, 'kakao'); break;
        case 'rc:sms': copyReceipt(id, 'sms'); break;
        case 'rc:image': shareReceiptImage(id); break;
        case 'rc:print': printOrder(id); break;
        case 'pin:ok': submitPin(); break;
        case 'admin:lock': setMode('customer'); break;
        case 'atab': state.ui.tab = el.getAttribute('data-tab'); renderAdminTab(); break;
        case 'mon:period': state.ui.monPeriod = el.getAttribute('data-period'); renderAdminTab(); break;
        case 'mon:branch': state.ui.monBranch = el.getAttribute('data-branch'); renderAdminTab(); break;
        case 'mon:refresh': refreshMonitor(false); break;
        case 'mon:view': openOrderView(id); break;
        case 'stock:new': openStockForm({ productId: id || '', type: el.getAttribute('data-type') || 'in' }); break;
        case 'stock:safety': openSafetyForm(id); break;
        case 'stock:safetySave': saveSafetyForm(id); break;
        case 'stock:save': saveStockForm(); break;
        case 'sf:type': setStockFormType(el.getAttribute('data-type')); break;
        case 'export:stock': exportStockCSV(); break;
        case 'rc:show': showReceipt(id); break;
        case 'period': state.ui.period = el.getAttribute('data-period'); renderAdminTab(); break;
        case 'operiod': state.ui.orderPeriod = el.getAttribute('data-period'); renderAdminTab(); break;
        case 'settle:apply': state.ui.from = val('#rangeFrom'); state.ui.to = val('#rangeTo'); renderAdminTab(); break;
        case 'pnew': openProductForm(null); break;
        case 'pedit': openProductForm(id); break;
        case 'psave': saveProductForm(); break;
        case 'pdel': {
          var del = productById(id);
          if (del && window.confirm('"' + del.name + '" 품목을 삭제할까요?\n지난 주문 기록은 그대로 남습니다.')) {
            state.pub.products = state.pub.products.filter(function (x) { return x.id !== id; });
            delete state.sec.costs[id];
            delete state.sec.costExample[id];
            saveAll();
            renderAdminTab();
            toast('삭제했습니다.');
          }
          break;
        }
        case 'order:view': openOrderView(id); break;
        case 'export:orders': exportOrdersCSV(); break;
        case 'sync:saveUrl': {
          state.pub.settings.syncUrl = val('#syncUrl').trim();
          savePub();
          armAutoSync();
          state.ui.syncMsg = syncUrl() ? 'URL을 저장했습니다. 연결 테스트를 눌러 확인하세요.' : '로컬 저장 모드로 전환했습니다.';
          state.ui.syncOk = true;
          state.ui.syncBusy = false;
          refreshSyncBox();
          toast(state.ui.syncMsg);
          break;
        }
        case 'sync:test': syncTest(); break;
        case 'sync:now': syncNow(); break;
        case 'sync:pushProducts': pushProducts(); break;
        case 'sync:pullProducts': pullProducts(); break;
        case 'sync:pushOrders': pushPendingOrders(false); break;
        case 'sync:pullOrders': pullOrders(); break;
        case 'sync:pushStock': pushStockAction(); break;
        case 'sync:pullStock': pullStockAction(); break;
        case 'set:save': saveSettings(); break;
        case 'rc:copyacct': copyAccount(); break;
        case 'rc:openlink': openTransferLink(); break;
        case 'set:pin': openPinChange(); break;
        case 'set:pinSave': savePinChange(); break;
        case 'seller:ok': submitSellerPin(); break;
        case 'seller:lock': lockSeller(); break;
        case 'set:sellerPin': openSellerPinChange(); break;
        case 'set:sellerPinSave': saveSellerPinChange(); break;
        case 'set:brseller': openBranchSellerPin(id); break;
        case 'set:brsellerSave': saveBranchSellerPin(id); break;
        case 'set:brsellerClear': clearBranchSellerPin(id); break;
        case 'set:brurl': copyBranchUrl(id); break;
        case 'set:backup': exportBackup(); break;
        case 'set:restore': restoreBackup(); break;
        case 'set:seed': seedAgain(); break;
        case 'set:reset': resetAll(); break;
        case 'br:add': openBranchForm(null); break;
        case 'br:edit': openBranchForm(id); break;
        case 'br:save': saveBranchForm(id); break;
        case 'br:default':
          state.pub.settings.defaultBranchId = id;
          state.pub.settings.currentBranchId = id;
          savePub();
          renderAdmin();
          renderCustomer();
          toast('기본 지점으로 지정했습니다.');
          break;
        case 'br:del': deleteBranch(id); break;
        case 'cart:open': openCartSheet(); break;
        case 'cart:close': closeCartSheet(); break;
        default: break;
      }
    });

    // 카드 키보드 접근
    try {
      if (typeof window !== 'undefined' && window.history && typeof window.history.replaceState === 'function') {
        if (!window.history.state) window.history.replaceState({ posBase: true }, '');
      }
    } catch (e) { /* noop */ }
    on(window, 'popstate', function () {
      var mr = $('#modalRoot');
      if (mr && mr.innerHTML && state.ui.leafId) { showDetailFromLeaflet(state.ui.leafId); return; }
      if (mr && mr.innerHTML) { closeModal(); return; }
      if (document.body && document.body.classList.contains('sheet-open')) { closeCartSheet(); return; }
      if (state.ui.mode === 'admin') { setMode('customer'); return; }
    });
    document.addEventListener('keydown', function (e) {
      var t = e.target;
      if (!t || !t.getAttribute) return;
      if (e.key === 'Enter' && $('#pinInput') && document.activeElement === $('#pinInput')) { submitPin(); return; }
      if (e.key === 'Enter' && $('#sellerPin') && document.activeElement === $('#sellerPin')) { submitSellerPin(); return; }
      if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute('data-act') === 'detail') {
        e.preventDefault();
        openDetail(t.getAttribute('data-id'));
      }
      if (e.key === 'Escape') {
        if (state.ui.leafId) { showDetailFromLeaflet(state.ui.leafId); return; }
        if ($('#modalRoot') && $('#modalRoot').innerHTML) closeModal();
        else document.body.classList.remove('sheet-open');
      }
    });

    // 상품 검색
    document.addEventListener('input', function (e) {
      var id = e.target && e.target.id;
      if (id === 'q') {
        state.ui.query = e.target.value;
        var cl = $('#qClear');
        if (cl) cl.classList.toggle('show', !!e.target.value);
        renderGrid();
      } else if (id === 'discValue') {
        state.ui.discount = { type: state.ui.discount.type, value: num(e.target.value) };
        renderCart();
      } else if (id === 'pfPrice' || id === 'pfCost' || id === 'pfImage') {
        updatePfMargin();
      } else if (id === 'prodQuery') {
        state.ui.prodQuery = e.target.value;
        var body = $('#adminBody');
        if (body) {
          body.innerHTML = productsHTML();
          var inp = $('#prodQuery');
          if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        }
      } else if (id === 'orderQuery') {
        state.ui.orderQuery = e.target.value;
        var body2 = $('#adminBody');
        if (body2) {
          body2.innerHTML = ordersHTML();
          var inp2 = $('#orderQuery');
          if (inp2) { inp2.focus(); inp2.setSelectionRange(inp2.value.length, inp2.value.length); }
        }
      } else if (id === 'syncUrl') {
        // 저장 버튼으로 반영
      } else if (id === 'sfQty') {
        stockFormQtyTouched = true;
      } else if (id === 'stockQuery') {
        state.ui.stockQuery = e.target.value;
        var body3 = $('#adminBody');
        if (body3) {
          body3.innerHTML = stockHTML();
          var inp3 = $('#stockQuery');
          if (inp3) { inp3.focus(); inp3.setSelectionRange(inp3.value.length, inp3.value.length); }
        }
      }
    });

    document.addEventListener('change', function (e) {
      var t = e.target;
      if (!t) return;
      if (t.id === 'branchSelect') { setBranch(t.value); }
      else if (t.id === 'discType') {
        state.ui.discount = { type: t.value, value: t.value === 'none' ? 0 : num(val('#discValue')) };
        renderCart();
      } else if (t.id === 'payMethod') { state.ui.payment = t.value; renderCart(); }
      else if (t.getAttribute && t.getAttribute('data-act') === 'ptoggle') {
        var p = productById(t.getAttribute('data-id'));
        var field = t.getAttribute('data-field');
        if (p) {
          p[field] = !!t.checked;
          p.updatedAt = Date.now();
          saveAll();
          renderAdminTab();
        }
      } else if (t.getAttribute && t.getAttribute('data-o-status')) {
        setOrderStatus(t.getAttribute('data-o-status'), t.value);
      } else if (t.id === 'orderStatus') { state.ui.orderStatus = t.value; renderAdminTab(); }
      else if (t.id === 'orderBranch') { state.ui.orderBranch = t.value; renderAdminTab(); }
      else if (t.id === 'adminBranch') { state.ui.adminBranch = t.value; renderAdminTab(); }
      else if (t.id === 'stockBranchSel') { state.ui.stockBranch = t.value; renderAdminTab(); }
      else if (t.id === 'stockCat') { state.ui.stockCat = t.value; renderAdminTab(); }
      else if (t.id === 'stockState') { state.ui.stockState = t.value; renderAdminTab(); }
      else if (t.id === 'stockHistBranch') { state.ui.stockHistBranch = t.value; renderAdminTab(); }
      else if (t.id === 'stockHistType') { state.ui.stockHistType = t.value; renderAdminTab(); }
      else if (t.id === 'sfBranch' || t.id === 'sfProduct') { updateStockFormNow(); }
      else if (t.id === 'autoSync') {
        state.pub.settings.autoSync = !!t.checked;
        savePub();
        armAutoSync();
        toast(t.checked ? '자동 동기화를 켰습니다.' : '자동 동기화를 껐습니다.');
      } else if (t.id === 'autoSec') {
        state.pub.settings.autoSyncSec = num(t.value);
        savePub();
        armAutoSync();
      } else if (t.id === 'stSellerLock') {
        var sl = sellerAuth();
        sl.enabled = !!t.checked;
        sl.updatedAt = Date.now();
        /* 지금 이 탭은 이미 들어와 있으니 세션을 그대로 남긴다 — 다음에 열 때부터 적용 */
        if (sl.enabled) writeSess(LS_SESSION, { ok: true, sig: sellerSig(), branchId: currentBranch().id, at: Date.now() });
        saveSec();
        toast(sl.enabled ? '판매원 오픈 잠금을 켰습니다. 다음에 페이지를 열 때부터 비밀번호를 묻습니다.' : '판매원 오픈 잠금을 껐습니다. 다음에 열면 바로 판매 화면이 나옵니다.');
        renderAdminTab();
      }
    });

    // 채널 선택
    $$('#channelSeg button').forEach(function (b) {
      on(b, 'click', function () {
        var ch = b.getAttribute('data-channel');
        var cur = currentBranch();
        var want = ch === 'online' ? 'online' : 'offline';
        state.ui.channel = ch;
        if (cur.type !== want) {
          var alt = branchList().filter(function (x) { return x.type === want; })[0];
          if (alt) setBranch(alt.id, { silent: true });
        }
        renderCart();
        renderHeader();
      });
    });
    on($('#branchBtn'), 'click', openBranchPicker);
    on($('#branchSelect'), 'change', function (e) { setBranch(e.target.value); });
    on($('#qClear'), 'click', function () {
      var q = $('#q'); if (q) q.value = '';
      state.ui.query = '';
      var cl = $('#qClear'); if (cl) cl.classList.remove('show');
      renderGrid();
    });
    on($('#cartOpen'), 'click', openCartSheet);
    on($('#cartClose'), 'click', closeCartSheet);
    on($('#orderConfirm'), 'click', confirmOrder);
    on($('#modeCustomer'), 'click', function () { setMode('customer'); });
    on($('#modeAdmin'), 'click', function () { setMode('admin'); });

    // 네트워크 상태
    function netState() {
      var p = $('#netPill');
      if (!p) return;
      var off = (typeof navigator !== 'undefined' && navigator.onLine === false);
      p.classList.toggle('show', off);
    }
    if (typeof window !== 'undefined') {
      window.addEventListener('online', netState);
      window.addEventListener('offline', netState);
      netState();
    }
  }

  function initialMode() {
    try {
      var s = String(window.location.search || '') + String(window.location.hash || '');
      if (/mode=admin|^#admin/.test(s)) return 'admin';
    } catch (e) { /* noop */ }
    return 'customer';
  }

  function boot() {
    loadAll();
    applyBranchFromUrl();   // ?branch=지점명 / ?b=지점ID → 그 지점으로 열기
    bindEvents();
    /* 판매원 잠금이 켜져 있으면 잠금 화면만 그리고, 품목·주문·가격은 풀린 뒤에 렌더링한다. */
    if (sellerLocked()) renderSellerGate();
    else openSellerApp();
    if (mergeInfo && mergeInfo.added > 0 && !sellerLocked()) {
      toast('새 기본 품목 ' + mergeInfo.added + '종을 목록에 추가했습니다.');
    }
  }

  /* 테스트·외부 확인용 노출 (고객 화면에는 사용하지 않음) */
  var api = {
    calcMargin: calcMargin,
    applyDiscount: applyDiscount,
    calcCartTotals: calcCartTotals,
    csvCell: csvCell,
    toCSV: toCSV,
    hashPin: hashPin,
    fmtWon: fmtWon,
    fmtDateTime: fmtDateTime,
    num: num,
    int: int,
    computeSettle: computeSettle,
    orderCostRecord: orderCostRecord,
    periodRange: periodRange,
    buildReceiptText: buildReceiptText,
    buildShortText: buildShortText,
    receiptCanvasSpec: receiptCanvasSpec,
    receiptImageName: receiptImageName,
    shareReceiptImage: shareReceiptImage,
    buildPrintHTML: null,
    seedProducts: seedProducts,
    seedCosts: seedCosts,
    seedCostExample: seedCostExample,
    seedVersion: SEED_VERSION,
    defaultPub: defaultPub,
    defaultSec: defaultSec,
    productCardHTML: productCardHTML,
    matchQuery: matchesQuery,
    isSoldOut: isSoldOut,
    phSVG: phSVG,
    getState: function () { return state; },
    load: loadAll,
    save: saveAll
  };
  api.buildPrintHTML = function (o) { return printHTML(o); };
  /* 자동 검증용 내부 노출 — window.__POS_TEST__ 를 먼저 켠 경우에만 붙는다. 일반 사용에는 영향 없음. */
  if (typeof window !== 'undefined' && window.__POS_TEST__) {
    api._internal = {
      renderAdmin: renderAdmin, renderAdminTab: renderAdminTab,
      settleHTML: settleHTML, productsHTML: productsHTML, ordersHTML: ordersHTML,
      syncHTML: syncHTML, settingsHTML: settingsHTML,
      openProductForm: openProductForm, openDetail: openDetail, showReceipt: showReceipt,
      /* 제품 설명서(리플렛) */
      openLeaflet: openLeaflet, leafletBack: leafletBack, showDetailFromLeaflet: showDetailFromLeaflet,
      leafletDataOf: leafletDataOf, leafletAvailable: leafletAvailable, leafletBodyHTML: leafletBodyHTML,
      leafletOpenHTML: leafletOpenHTML, leafletHas: leafletHas, leafletList: leafletList, leafletInfoTable: leafletInfoTable,
      renderCats: renderCats, renderGrid: renderGrid, categories: categories,
      orderNo: orderNo,
      lineSections: lineSections, catOrder: CAT_ORDER, lineCats: CAT_ORDER, seedOrder: SEED_ORDER, reorderSeedProducts: reorderSeedProducts,
      saveSettings: saveSettings, paySettings: paySettings, safeTransferLink: safeTransferLink, payBlockHTML: payBlockHTML,
      mergeSeedProducts: mergeSeedProducts, mergeInfo: function () { return mergeInfo; }, telomereSVG: telomereSVG, phSVG: phSVG,
      receiptCanvasSpec: receiptCanvasSpec, drawReceiptCanvas: drawReceiptCanvas, receiptImageName: receiptImageName,
      openOrderView: openOrderView, openBranchForm: openBranchForm,
      openPinGate: openPinGate, openPinChange: openPinChange,
      /* 판매원 오픈 잠금 */
      sellerAuth: sellerAuth, isSellerUnlocked: isSellerUnlocked, sellerLocked: sellerLocked,
      sellerPinValid: sellerPinValid, sellerSig: sellerSig,
      submitSellerPin: submitSellerPin, unlockSeller: submitSellerPin, lockSeller: lockSeller,
      renderSellerGate: renderSellerGate, openSellerApp: openSellerApp,
      hasBranchPassword: hasBranchPassword, applySellerPin: applySellerPin,
      applyBranchSellerPin: applyBranchSellerPin, dropBranchSellerPin: dropBranchSellerPin,
      openSellerPinChange: openSellerPinChange, openBranchSellerPin: openBranchSellerPin,
      branchUrlFor: branchUrlFor, copyBranchUrl: copyBranchUrl,
      urlBranchKey: urlBranchKey, matchBranch: matchBranch, applyBranchFromUrl: applyBranchFromUrl,
      currentBranch: currentBranch, bootApp: boot,
      printHTML: printHTML, setMode: setMode, filteredOrders: filteredOrders,
      confirmOrder: confirmOrder, setBranch: setBranch,
      pushProducts: pushProducts, syncNow: syncNow, exportOrdersCSV: exportOrdersCSV,
      /* 재고 입출고 · 본점 판매 모니터링 */
      stockHTML: stockHTML, stockRows: stockRows, stockCounts: stockCounts, stockCSVRows: stockCSVRows,
      stockLogsFiltered: stockLogsFiltered, exportStockCSV: exportStockCSV, stockLogLabel: stockLogLabel,
      openStockForm: openStockForm, saveStockForm: saveStockForm, openSafetyForm: openSafetyForm,
      saveSafetyForm: saveSafetyForm, setStockFormType: setStockFormType, updateStockFormNow: updateStockFormNow,
      stockBranchId: stockBranchId, applyStockChange: applyStockChange, applyOrderStock: applyOrderStock,
      branchQty: branchQty, safetyQtyOf: safetyQtyOf, stockStateOf: stockStateOf, availableQty: availableQty,
      addToCart: addToCart, changeQty: changeQty, removeFromCart: removeFromCart, closeModal: closeModal,
      seedStockStructures: seedStockStructures, syncOrderStock: syncOrderStock, isClosedStatus: isClosedStatus,
      setOrderStatus: setOrderStatus, stockTypeMeta: stockTypeMeta, stockTypes: STOCK_TYPES,
      monitorHTML: monitorHTML, monitorStats: monitorStats, monitorOrders: monitorOrders,
      monitorRange: monitorRange, monitorPeriods: MON_PERIODS, refreshMonitor: refreshMonitor, monOnEnter: monOnEnter,
      syncStockPush: syncStockPush, stockInventoryPayload: stockInventoryPayload, mergeRemoteStock: mergeRemoteStock,
      pendingStockLogs: pendingStockLogs, stockLogPayload: stockLogPayload
    };
  }
  if (typeof window !== 'undefined') window.GCOOP = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;

  if (typeof document !== 'undefined' && document.getElementById && document.getElementById('app')) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  }
})();
</script>
</body>
</html>
