  }

  /* ---- 지점별 접속 링크 (?branch=지점명 / ?b=지점ID) ---- */
  function decodeParam(v) {
    var s = String(v == null ? '' : v);
    try { s = decodeURIComponent(s.replace(/\+/g, ' ')); } catch (e) { /* 이미 풀린 값 */ }
    return s.replace(/\s+/g, ' ').trim();
  }
  function urlBranchKey() {
    var q = '';
    try { q = String((typeof window !== 'undefined' && window.location && window.location.search) || ''); } catch (e) { q = ''; }
    var out = { id: '', name: '' };
    if (!q) return out;
    q.replace(/^\?/, '').split('&').forEach(function (part) {
      if (!part) return;
      var i = part.indexOf('=');
      var k = (i < 0 ? part : part.slice(0, i)).toLowerCase();
      var v = i < 0 ? '' : part.slice(i + 1);
      if (k === 'branch') out.name = decodeParam(v);
      else if (k === 'b' || k === 'branchid') out.id = decodeParam(v);
    });
    return out;
  }
  function normBranchKey(v) { return String(v == null ? '' : v).replace(/[\s·]+/g, '').toLowerCase(); }
  /* 지점 목록에 없는 이름이면 null — 호출한 쪽이 기본 지점을 그대로 쓴다 */
  function matchBranch(key) {
    var k = normBranchKey(key);
    if (!k) return null;
    var list = branchList();
    var shop = normBranchKey(state.pub && state.pub.settings ? state.pub.settings.shopName : '');
    var i;
    for (i = 0; i < list.length; i++) if (normBranchKey(list[i].id) === k) return list[i];
    for (i = 0; i < list.length; i++) if (normBranchKey(list[i].name) === k) return list[i];
    // '다시봄 동탄점'처럼 가게 이름을 붙여 보낸 링크도 받아 준다
    if (shop) {
      for (i = 0; i < list.length; i++) {
        if (normBranchKey(shop + list[i].name) === k) return list[i];
        if (k.indexOf(shop) === 0 && normBranchKey(list[i].name) === normBranchKey(k.slice(shop.length))) return list[i];
      }
    }
    return null;
  }
  function applyBranchFromUrl() {
    var key = urlBranchKey();
    if (!key.id && !key.name) return null;
    var b = matchBranch(key.id) || matchBranch(key.name);
    if (!b) return null;
    state.pub.settings.currentBranchId = b.id;
    state.ui.channel = b.type === 'online' ? 'online' : 'offline';
    savePub();
    return b;
  }
  function branchUrlFor(b) {
    var base = '';
    try {
      var loc = (typeof window !== 'undefined' && window.location) ? window.location : null;
      if (loc) {
        var origin = String(loc.origin || '');
        if (!origin || origin === 'null') origin = '';
        base = origin + String(loc.pathname || '');
      }
    } catch (e) { /* noop */ }
    if (!base) base = 'pos.html';
    return base + '?branch=' + encodeURIComponent(b && b.name ? b.name : '');
  }
  function copyBranchUrl(id) {
    var b = branchById(id);
    if (!b) return;
    var url = branchUrlFor(b);
    copyText(url).then(function (ok) {
      if (ok) toast((b.name || '지점') + ' 접속 링크를 복사했습니다.');
      else showCopyFallback(url);
    });
  }

  /* ============ 4-1b) 판매원 오픈 잠금 (초기 진입 게이트) ============
     · 페이지를 열면 로고 + 현재 지점명 + 판매원 비밀번호 입력창이 가장 먼저 뜬다.
     · 잠금이 풀리기 전에는 고객 화면(#app)을 숨기고 품목·주문·가격을 렌더링하지 않는다.
     · 한 번 풀면 같은 탭(sessionStorage) 안에서는 새로고침해도 다시 묻지 않는다.
     · 비밀번호는 지점마다 따로 정할 수 있고, 비워 두면 공통 비밀번호를 쓴다. */
  var sellerFail = { count: 0, until: 0 };
  var memSession = {};

  function sessStore() {
    try {
      var ss = (typeof window !== 'undefined' && window.sessionStorage) ? window.sessionStorage : null;
      if (!ss && typeof sessionStorage !== 'undefined') ss = sessionStorage;
      if (ss) {
        var k = '__gcoop_sess_probe__';
        ss.setItem(k, '1');
        ss.removeItem(k);
        return ss;
      }
    } catch (e) { /* 세션 저장소를 막은 브라우저 */ }
    return {
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(memSession, k) ? memSession[k] : null; },
      setItem: function (k, v) { memSession[k] = String(v); },
      removeItem: function (k) { delete memSession[k]; }
    };
  }
  function readSess(key) {
    try {
      var raw = sessStore().getItem(key);
      if (!raw) return null;
      var o = JSON.parse(raw);
      return (o && typeof o === 'object') ? o : null;
    } catch (e) { return null; }
  }
  function writeSess(key, value) {
    try {
      if (value == null) sessStore().removeItem(key);
      else sessStore().setItem(key, JSON.stringify(value));
      return true;
    } catch (e) { return false; }
  }

  function sellerAuth() {
    if (!state.sec) state.sec = defaultSec();
    if (!state.sec.seller || typeof state.sec.seller !== 'object') state.sec.seller = defaultSec().seller;
    var s = state.sec.seller;
    if (typeof s.enabled !== 'boolean') s.enabled = true;
    if (!s.branches || typeof s.branches !== 'object') s.branches = {};
    return s;
  }
  function hasBranchPassword(id) {
    var b = sellerAuth().branches[id];
    return !!(b && b.salt && b.hash);
  }
  /* 비밀번호 구성이 바뀌면(변경·초기화) 이전 탭의 잠금 해제 표시가 자동으로 무효가 된다. */
  function sellerSig() {
    var s = sellerAuth();
    var parts = [String(s.enabled !== false ? 1 : 0), String(s.salt || ''), String(s.hash || '')];
    var keys = Object.keys(s.branches || {}).sort();
    for (var i = 0; i < keys.length; i++) {
      var b = s.branches[keys[i]] || {};
      parts.push(keys[i], String(b.salt || ''), String(b.hash || ''));
    }
    return fnv1a(parts.join('|')).toString(16);
  }
  function isSellerUnlocked() {
    var s = sellerAuth();
    if (s.enabled === false) return true;
    var rec = readSess(LS_SESSION);
    if (!rec || rec.ok !== true) return false;
    return rec.sig === sellerSig();
  }
  function sellerLocked() { return !isSellerUnlocked(); }

  function sellerPinValid(branchId, pin) {
    var s = sellerAuth();
    var p = digitsOnly(pin);
    if (!p) return false;
    var b = s.branches[branchId];
    if (b && b.hash) return hashPin(p, b.salt) === b.hash;
    return hashPin(p, s.salt) === s.hash;
  }
  function applySellerPin(pin) {
    var s = sellerAuth();
    var salt = randomSalt();
    s.salt = salt;
    s.hash = hashPin(digitsOnly(pin), salt);
    s.isDefault = false;
    s.updatedAt = Date.now();
    saveSec();
    return true;
  }
  function applyBranchSellerPin(id, pin) {
    var s = sellerAuth();
    var salt = randomSalt();
    s.branches[id] = { salt: salt, hash: hashPin(digitsOnly(pin), salt), at: Date.now() };
    s.updatedAt = Date.now();
    saveSec();
    return true;
  }
  function dropBranchSellerPin(id) {
    var s = sellerAuth();
    if (!s.branches[id]) return false;
    delete s.branches[id];
    s.updatedAt = Date.now();
    saveSec();
    return true;
  }

  function sellerMsg(text) {
    var el = $('#sellerPinMsg');
    if (el) el.textContent = text || '';
  }

  /* 잠금 화면: 로고 + 현재 지점명 + 비밀번호 입력 (품목·가격은 렌더링하지 않는다) */
  function renderSellerGate() {
    var b = currentBranch();
    var shop = (state.pub && state.pub.settings && state.pub.settings.shopName) || '다시봄';
    var own = hasBranchPassword(b.id);
    if (typeof document !== 'undefined' && document.body && document.body.classList) document.body.classList.add('gate-locked');
    var app = $('#app'); if (app) app.hidden = true;
    var gate = $('#sellerGate');
    if (!gate) return;
    gate.innerHTML = '<div class="sg-wrap"><div class="sg-card">' +
      '<div class="sg-mark" aria-hidden="true">' + telomereSVG(64) + '</div>' +
      '<p class="kicker">Telomere Lifestyle · Daily Cell Care</p>' +
      '<h1 id="sgTitle">' + esc(shop) + ' ' + esc(b.name) + '</h1>' +
      '<p class="sg-sub">판매원 비밀번호를 입력해 주세요.' +
      (own ? '<br><b>' + esc(b.name) + '</b> 전용 비밀번호입니다.' : '') + '</p>' +
      '<div class="field sg-pin"><label for="sellerPin" class="sr">판매원 비밀번호</label>' +
      '<input type="password" id="sellerPin" inputmode="numeric" maxlength="8" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="" aria-label="판매원 비밀번호"></div>' +
      '<p class="hint sg-msg" id="sellerPinMsg" role="status" aria-live="polite"></p>' +
      '<button type="button" class="btn primary block" data-act="seller:ok">판매원 화면 열기</button>' +
      '<p class="sg-foot"><b>' + esc(shop) + '</b> 판매원 전용 화면입니다.<br>비밀번호는 관리자 → 설정에서 지점별로 정합니다.</p>' +
      '</div></div>';
    gate.hidden = false;
    var inp = $('#sellerPin');
    if (inp) { try { inp.focus(); } catch (e) { /* noop */ } }
  }

  function openSellerApp() {
    var gate = $('#sellerGate');
    if (gate) { gate.hidden = true; gate.innerHTML = ''; }
    if (typeof document !== 'undefined' && document.body && document.body.classList) document.body.classList.remove('gate-locked');
    var app = $('#app'); if (app) app.hidden = false;
    renderCustomer();
    armAutoSync();
    if (initialMode() === 'admin' && !state.ui.adminUnlocked) openPinGate();
  }

  /* 판매원 비밀번호 확인 → 맞으면 잠금 해제하고 화면을 연다. 틀리면 5회에 30초 잠금. */
  function submitSellerPin(pinArg) {
    var inp = $('#sellerPin');
    var pin = digitsOnly(pinArg == null ? (inp ? inp.value : '') : pinArg);
    var now = Date.now();
    if (sellerFail.until > now) {
      sellerMsg('잠시 후 다시 시도해 주세요. (' + Math.ceil((sellerFail.until - now) / 1000) + '초)');
      return false;
    }
    if (!pin) {
      sellerMsg('판매원 비밀번호를 입력해 주세요.');
      return false;
    }
    if (sellerPinValid(currentBranch().id, pin)) {
      sellerFail = { count: 0, until: 0 };
      if (inp) inp.value = '';
      writeSess(LS_SESSION, { ok: true, sig: sellerSig(), branchId: currentBranch().id, at: now });
      openSellerApp();
      return true;
    }
    sellerFail.count++;
    if (sellerFail.count >= 5) {
      sellerFail.until = now + 30000;
      sellerFail.count = 0;
      sellerMsg('5회 틀렸습니다. 30초 뒤에 다시 시도해 주세요.');
    } else {
      sellerMsg('판매원 비밀번호가 맞지 않습니다.');
    }
    if (inp) { inp.value = ''; try { inp.focus(); } catch (e) { /* noop */ } }
    return false;
  }

  /* 잠그기(로그아웃): 탭 세션 표시를 지우고, 화면에 남은 품목·장바구니를 비운 뒤 잠금 화면으로 */
  function lockSeller() {
    writeSess(LS_SESSION, null);
    sellerFail = { count: 0, until: 0 };
    state.ui.cart = [];
    state.ui.discount = { type: 'none', value: 0 };
    state.ui.adminUnlocked = false;
    state.ui.mode = 'customer';
    if (typeof document !== 'undefined' && document.body && document.body.classList) document.body.classList.remove('admin-mode');
    var ar = $('#adminRoot'); if (ar) { ar.hidden = true; ar.innerHTML = ''; }
    var cv = $('#customerView'); if (cv) cv.hidden = false;
    var grid = $('#grid'); if (grid) { grid.innerHTML = ''; }
    var cats = $('#cats'); if (cats) cats.innerHTML = '';
    var empt = $('#gridEmpty'); if (empt) empt.hidden = true;
    var bs = $('#branchSelect'); if (bs) bs.innerHTML = '';
    var mc = $('#modeCustomer'), ma = $('#modeAdmin');
    if (mc) { mc.classList.add('active'); mc.setAttribute('aria-pressed', 'true'); }
    if (ma) { ma.classList.remove('active'); ma.setAttribute('aria-pressed', 'false'); }
    renderCart();
    renderSellerGate();
    toast('판매원 화면을 잠갔습니다.');
  }

  /* ============ 4-2) 고객 화면 ============ */
  function renderHeader() {
    var pub = state.pub;
    var b = currentBranch();
    var nameEl = $('#shopName');
    if (nameEl) nameEl.textContent = pub.settings.shopName || '다시봄';
    var sub = $('#brandSub');
    if (sub) sub.textContent = (b ? b.name + ' · ' : '') + '텔로미어 라이프스타일';
    var hb = $('#heroBranch');
    if (hb) hb.textContent = b ? b.name : '';
    document.title = (pub.settings.shopName || '다시봄') + ' POS · ' + (b ? b.name + ' · ' : '') + '텔로미어 라이프스타일';
  }

  function renderCats() {
    var box = $('#cats');
    if (!box) return;
    var lines = categories();
    // 고른 카테고리가 사라졌으면(품목 삭제·라인 정리) '전체'로 돌아간다
    if (state.ui.category !== '전체' && lines.indexOf(state.ui.category) < 0) state.ui.category = '전체';
    var cats = ['전체'].concat(lines);
    var html = cats.map(function (c) {
      return '<button type="button" class="chip' + (state.ui.category === c ? ' active' : '') +
        '" data-act="cat" data-cat="' + esc(c) + '" role="tab" aria-selected="' + (state.ui.category === c) + '">' + esc(c) + '</button>';
    }).join('');
    box.innerHTML = html;
  }

  function matchesQuery(p, q) {
    if (!q) return true;
    var hay = [p.name, p.category, p.summary, p.ingredients, p.usage].join(' ').toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function filteredProducts() {
    var cat = state.ui.category;
    var q = (state.ui.query || '').trim().toLowerCase();
    return visibleProducts().filter(function (p) {
      if (cat !== '전체' && (p.category || '기타') !== cat) return false;
      return matchesQuery(p, q);
    }).sort(function (a, b) { return (num(a.sort) || 0) - (num(b.sort) || 0); });
  }

  function isSoldOut(p) { return !!p.soldout || availableQty(p) <= 0; }
  /* 지금 이 기기의 지점에서 팔 수 있는 수량 — 지점 재고가 기준이고, 기록이 없으면 품목 stock */
  function availableQty(p) {
    if (!p) return 0;
    var b = currentBranch();
    return branchQty(p.id, b ? b.id : '');
  }
  function currentStockState(p) {
    var b = currentBranch();
    return stockStateOf(p && p.id, b ? b.id : '');
  }

  function productCardHTML(p) {
    var out = isSoldOut(p);
    var st = currentStockState(p);
    return '<article class="card" data-act="detail" data-id="' + esc(p.id) + '" tabindex="0" role="button" aria-label="' + esc(p.name) + ' 상세 보기">' +
      '<div class="card-media">' + imgHTML(p, '') +
      (out ? '<span class="tag-soldout">품절</span>' : '') +
      '</div>' +
      '<div class="card-body">' +
      '<div class="card-tags">' +
      '<span class="cat-tag">' + esc(p.category || '기타') + '</span>' +
      (!out && st.state === 'low' ? '<span class="stock-tag">재고 ' + st.qty + '개</span>' : '') +
      '</div>' +
      '<h3>' + esc(p.name) + '</h3>' +
      '<p class="card-sum">' + esc(p.summary || '') + '</p>' +
      '<div class="card-foot">' +
      '<div class="price">' + groupNum(p.price) + '<span class="unit">원</span></div>' +
      '<button type="button" class="add-btn" data-act="add" data-id="' + esc(p.id) + '"' + (out ? ' disabled' : '') + '>담기</button>' +
      '</div></div></article>';
  }

  /* '전체' 보기를 지쿱 라인별로 묶는다 — [{cat, items}] (라인 순서 → 기타 순) */
  function lineSections(list) {
    var order = categories();
    var groups = [], byCat = {};
    (list || filteredProducts()).forEach(function (p) {
      var c = p.category || '기타';
      if (!byCat[c]) { byCat[c] = { cat: c, items: [] }; groups.push(byCat[c]); }
      byCat[c].items.push(p);
    });
    groups.sort(function (a, b) {
      var ia = order.indexOf(a.cat), ib = order.indexOf(b.cat);
      if (ia < 0) ia = 999;
      if (ib < 0) ib = 999;
      return ia - ib;
    });
    return groups;
  }

  function lineHeadHTML(cat, n) {
    return '<div class="line-head"><h2>' + esc(cat) + '</h2>' +
      '<span class="line-count">(' + n + ')</span></div>';
  }

  function renderGrid() {
    var grid = $('#grid');
    if (!grid) return;
    var list = filteredProducts();
    var q = (state.ui.query || '').trim();
    // '전체' + 검색어 없음 → 라인별 섹션 / 라인 칩·검색어 → 결과만
    var byLine = state.ui.category === '전체' && !q;
    if (byLine) {
      grid.innerHTML = lineSections(list).map(function (g) {
        return '<section class="line-sec" data-line="' + esc(g.cat) + '" aria-label="' + esc(g.cat) + ' ' + g.items.length + '종">' +
          lineHeadHTML(g.cat, g.items.length) +
          '<div class="line-grid">' + g.items.map(productCardHTML).join('') + '</div></section>';
      }).join('');
    } else {
      grid.innerHTML = list.map(productCardHTML).join('');
    }
    if (grid.classList && grid.classList.toggle) grid.classList.toggle('line-wrap', byLine);
    if (grid.setAttribute) grid.setAttribute('data-view', byLine ? 'line' : 'flat');
    var empty = $('#gridEmpty');
    if (empty) empty.hidden = list.length > 0;
    grid.hidden = list.length === 0;
  }

  function cartResolved() {
    var out = [];
    state.ui.cart.forEach(function (it) {
      var p = productById(it.id);
      if (p) out.push({ id: it.id, qty: Math.max(1, int(it.qty)), product: p });
    });
    return out;
  }
  function cartTotals() {
    var lines = cartResolved().map(function (l) { return { price: l.product.price, qty: l.qty }; });
    return calcCartTotals(lines, state.ui.discount);
  }

  function renderCart() {
    var box = $('#cartLines');
    if (!box) return;
    var lines = cartResolved();
    var t = cartTotals();

    box.innerHTML = lines.map(function (l) {
      var p = l.product;
      return '<div class="cart-line" data-id="' + esc(p.id) + '">' +
        '<div class="cl-name">' + esc(p.name) + '</div>' +
        '<div class="cl-meta">' + fmtWon(p.price) + ' × ' + l.qty +
        ' <button type="button" data-act="remove" data-id="' + esc(p.id) + '">삭제</button></div>' +
        '<div class="cl-right">' +
        '<div class="qty">' +
        '<button type="button" data-act="qty" data-id="' + esc(p.id) + '" data-d="-1" aria-label="수량 줄이기">−</button>' +
        '<span>' + l.qty + '</span>' +
        '<button type="button" data-act="qty" data-id="' + esc(p.id) + '" data-d="1" aria-label="수량 늘리기">+</button>' +
        '</div>' +
        '<span class="cl-sum">' + fmtWon(int(p.price) * l.qty) + '</span>' +
        '</div></div>';
    }).join('');

    var emptyEl = $('#cartEmpty');
    if (emptyEl) emptyEl.hidden = lines.length > 0;
    box.hidden = lines.length === 0;

    var cnt = t.qty;
    var cEl = $('#cartCount'); if (cEl) cEl.textContent = cnt + '개';
    var sEl = $('#tSubtotal'); if (sEl) sEl.textContent = fmtWon(t.subtotal);
    var dEl = $('#tDiscount'); if (dEl) dEl.textContent = '-' + fmtWon(t.discount);
    var ttEl = $('#tTotal'); if (ttEl) ttEl.textContent = fmtWon(t.total);
    var cbC = $('#cbCount'); if (cbC) cbC.textContent = '장바구니 ' + cnt + '개';
    var cbT = $('#cbTotal'); if (cbT) cbT.textContent = fmtWon(t.total);

    var btn = $('#orderConfirm');
    if (btn) btn.disabled = lines.length === 0;

    // 채널 · 결제 · 지점 상태 동기화
    $$('#channelSeg button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-channel') === state.ui.channel);
    });
    var pay = $('#payMethod');
    if (pay) pay.value = state.ui.payment;
    var bs = $('#branchSelect');
    if (bs) bs.value = currentBranch().id;
    var dt = $('#discType'); if (dt) dt.value = state.ui.discount.type;
    var dv = $('#discValue');
    if (dv) {
      dv.disabled = state.ui.discount.type === 'none';
      dv.value = state.ui.discount.type === 'none' ? '' : String(state.ui.discount.value || '');
    }
  }

  function renderBranchSelect() {
    var sel = $('#branchSelect');
    if (!sel) return;
    var list = branchList();
    sel.innerHTML = list.map(function (b) {
      return '<option value="' + esc(b.id) + '">' + esc((state.pub.settings.shopName || '다시봄') + ' ' + b.name) + '</option>';
    }).join('');
    sel.value = currentBranch().id;
  }

  function renderCustomer() {
    if (sellerLocked()) { renderSellerGate(); return; }
    renderHeader();
    renderBranchSelect();
    renderCats();
    renderGrid();
    renderCart();
  }

  /* ============ 4-3) 장바구니 동작 ============ */
  function addToCart(id, qty) {
    var p = productById(id);
    if (!p) return;
    if (isSoldOut(p)) { toast('품절된 상품입니다.'); return; }
    var q = Math.max(1, int(qty) || 1);
    var cur = 0;
    state.ui.cart.forEach(function (it) { if (it.id === id) cur = it.qty; });
    var stock = availableQty(p);
    var next = cur + q;
    if (stock > 0 && next > stock) {
      next = stock;
      toast('재고가 ' + stock + '개 남아 있습니다.');
      if (next <= cur) return;
    }
    var found = false;
    state.ui.cart.forEach(function (it) { if (it.id === id) { it.qty = next; found = true; } });
    if (!found) state.ui.cart.push({ id: id, qty: Math.min(q, stock > 0 ? stock : q) });
    renderCart();
    toast(p.name + ' 담았습니다.');
  }
  function changeQty(id, delta) {
    var p = productById(id);
    var stock = p ? availableQty(p) : 0;
    state.ui.cart.forEach(function (it) {
      if (it.id !== id) return;
      it.qty = int(it.qty) + int(delta);
      if (stock > 0 && it.qty > stock) { it.qty = stock; toast('재고가 ' + stock + '개 남아 있습니다.'); }
      if (it.qty <= 0) it.qty = 1;
    });
    renderCart();
  }
  function removeFromCart(id) {
    state.ui.cart = state.ui.cart.filter(function (it) { return it.id !== id; });
    renderCart();
  }
  function clearCart() {
    state.ui.cart = [];
    state.ui.discount = { type: 'none', value: 0 };
  }

  /* ============ 4-4) 상품 상세 ============ */
  function openDetail(id) {
    var p = productById(id);
    if (!p) return;
    state.ui.detailId = id;
    state.ui.detailQty = isSoldOut(p) ? 0 : 1;
    var out = isSoldOut(p);
    var points = (p.points || []).filter(function (x) { return String(x).trim(); });

    var html = '<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="detailName">' +
      '<div class="modal-head"><h2 id="detailName">상품 상세</h2><span class="kicker">Cell Care</span>' +
      '<button type="button" class="icon-btn" data-act="modal:close" aria-label="닫기">✕</button></div>' +
      '<div class="modal-body" style="padding:0">' +
      '<div class="detail-hero"><span class="kicker">' + esc(p.category || 'SELECTION') + '</span>' +

  /* ============ 4-4b) 제품 설명서(리플렛) ============
     leaflet-data.js 의 window.LEAFLET_DATA[productId] 원문을 그대로 보여 준다.
     · 없는 항목("", [], "확인 불가")은 섹션을 비우거나 생략한다.
     · 출처 표기·공식몰 링크·이미지 저장/공유 버튼은 넣지 않는다(고객에게 화면으로만 보여 줌).
     · 상세 이미지는 loading="lazy" 로 지연 로드해 모바일에서 바로 뜨게 한다. */
  function leafletStore() {
    var store = null;
    try { store = (typeof window !== 'undefined' && window.LEAFLET_DATA) ? window.LEAFLET_DATA : null; } catch (e) { store = null; }
    return (store && typeof store === 'object') ? store : null;
  }
  function leafletDataOf(id) {
    var store = leafletStore();
    if (!store || !id) return null;
    var d = store[id];
    return (d && typeof d === 'object') ? d : null;
  }
  function leafletAvailable(id) { return !!leafletDataOf(id); }
  /* 값이 실제로 있는지 — 빈 문자열 · 빈 배열 · "확인 불가" 는 비어 있는 것으로 본다 */
  function leafletHas(v) {
    if (v === null || v === undefined) return false;
    if (typeof v === 'string') {
      var s = v.replace(/\s+/g, ' ').trim();
      return !!s && s !== '-' && s.indexOf('확인 불가') !== 0;
    }
    if (typeof v === 'number') return isFinite(v);
    return true;
  }
  function leafletList(list, skip) {
    if (!Array.isArray(list)) return [];
    var skipList = Array.isArray(skip) ? skip : [];
    var out = [];
    list.forEach(function (x) {
      if (!leafletHas(x)) return;
      var s = String(x).replace(/[ \t]+\n/g, '\n').trim();
      if (s === '') return;
      if (skipList.indexOf(s) >= 0) return;
      if (out.indexOf(s) < 0) out.push(s);
    });
    return out;
  }
  function leafletSec(title, inner, cls) {
    if (!inner) return '';
    return '<section class="leaf-sec' + (cls ? ' ' + cls : '') + '"><h3>' + esc(title) + '</h3>' + inner + '</section>';
  }
  function leafletUL(items) {
    if (!items || !items.length) return '';
    return '<ul>' + items.map(function (x) { return '<li>' + nl2br(x) + '</li>'; }).join('') + '</ul>';
  }
  function leafletP(v) { return leafletHas(v) ? '<p>' + nl2br(v) + '</p>' : ''; }
  function leafletFigure(src, alt) {
    if (!leafletHas(src)) return '';
    return '<figure class="leaf-figure"><img src="' + esc(src) + '" alt="' + esc(alt) + '"' +
      ' loading="lazy" decoding="async" onerror="this.parentNode.hidden=true"></figure>';
  }
  function leafletInfoTable(rows) {
    var out = [];
    (Array.isArray(rows) ? rows : []).forEach(function (row) {
      if (!row || !row.length) return;
      var label = leafletHas(row[0]) ? String(row[0]).trim() : '';
      var value = leafletHas(row[1]) ? String(row[1]).trim() : '';
      if (!label || !value) return;
      out.push('<div class="leaf-info-row"><dt>' + nl2br(label) + '</dt><dd>' + nl2br(value) + '</dd></div>');
    });
    if (!out.length) return '';
    return '<div class="leaf-info">' + out.join('') + '</div>';
  }
  function leafletHeroHTML(p, d) {
    var chips = [];
    var type = leafletHas(d.productType) ? String(d.productType).trim() : '';
    var cap = leafletHas(d.capacity) ? String(d.capacity).trim() : '';
    if (type) chips.push(type);
    /* 구성품 용량이 길게 늘어선 세트 상품은 칩이 여러 줄이 되어 생략한다(제품 정보 고시에 용량이 있음) */
    if (cap && cap.length <= 24) chips.push(cap);
    var name = leafletHas(d.officialName) ? String(d.officialName).trim() : ((d && d.name) || (p && p.name) || '');
    var tagline = leafletHas(d.tagline) ? String(d.tagline).trim() : '';
    return '<div class="leaf-hero">' +
      (chips.length ? '<div class="leaf-chips">' + chips.map(function (c) {
        return '<span class="leaf-chip">' + esc(c) + '</span>';
      }).join('') + '</div>' : '') +
      '<h2 class="leaf-name">' + esc(name) + '</h2>' +
      (tagline ? '<p class="leaf-tagline">' + nl2br(tagline) + '</p>' : '') +
      '</div>';
  }
  /* 판매원 로그인이 막혀 원문을 못 가져온 품목 — POS에 정리된 설명 + 대표 이미지 1장 + 안내 */
  function leafletFallbackHTML(p, d) {
    var imgs = (d && Array.isArray(d.images)) ? d.images.filter(leafletHas) : [];
    var main = imgs.length ? imgs[0] : (p && p.image ? p.image : '');
    var points = (p && Array.isArray(p.points)) ? p.points.filter(function (x) { return String(x || '').trim(); }) : [];
    var body = '';
    body += leafletFigure(main, (p && p.name) || '');
    body += '<div class="leaf-msg"><b>상세 설명서는 지쿱 공식몰 판매원 로그인 후 확인이 필요해요</b>' +
      '이 품목은 공식몰 상세 페이지가 판매원 로그인에서만 열려, 지금은 POS에 정리해 둔 설명과 대표 이미지만 보여 드립니다. 상담할 때 참고해 주세요.</div>';
    body += leafletSec('핵심 포인트', leafletUL(points));
    if (p && leafletHas(p.ingredients)) body += leafletSec('주요 성분 · 기능성', leafletP(p.ingredients));
    if (p && leafletHas(p.usage)) body += leafletSec('섭취 · 사용 방법', leafletP(p.usage));
    if (p && leafletHas(p.caution)) body += leafletSec('주의사항', leafletP(p.caution), 'caution');
    return leafletHeroHTML(p, d) + '<div class="leaf-body">' + body + '</div>';
  }
  function leafletBodyHTML(p, d) {
    d = d || {};
    if (d.unavailable) return leafletFallbackHTML(p, d);
    var imgs = (Array.isArray(d.images) ? d.images : []).filter(leafletHas);
    var main = imgs.length ? imgs[0] : (p && p.image ? p.image : '');
    var gallery = imgs.slice(1);
    var storage = leafletHas(d.storage) ? String(d.storage).trim() : '';
    var body = '';
    body += leafletFigure(main, (d.officialName || d.name || (p && p.name) || ''));
    body += leafletSec('핵심 특징', leafletUL(leafletList(d.features)));
    if (leafletHas(d.ingredients)) body += leafletSec('원재료 · 성분', leafletP(d.ingredients));
    if (leafletHas(d.functionClaim)) body += leafletSec('기능 정보', leafletP(d.functionClaim));
    if (leafletHas(d.usage)) body += leafletSec('섭취 · 사용 방법', leafletP(d.usage));
    body += leafletSec('주의사항', leafletUL(leafletList(d.cautions, storage ? [storage] : [])), 'caution');
    if (storage) body += leafletSec('보관 방법', leafletP(storage));
    /* d.audience 는 수집된 원문에서 '섭취 대상'이 아니라 주의·보관 문구가 섞여 들어와
       화면에 「섭취 대상: 가. 어린이의 손이 닿지 않는 곳에 보관할 것」 처럼 어색하게 나온다.
       같은 문구가 주의사항·정보고시에 이미 들어 있어 섹션은 싣지 않는다. */
    var info = leafletInfoTable(d.infoTable);
    if (info) body += leafletSec('제품 정보 고시', info);
    if (leafletHas(d.disclaimer)) {
      /* 고시 표에 같은 문구가 이미 있으면 안내문을 또 쓰지 않는다 */
      var disc = String(d.disclaimer).replace(/\s+/g, ' ').trim();
      var dup = false;
      (Array.isArray(d.infoTable) ? d.infoTable : []).forEach(function (row) {
        if (row && row[1] && String(row[1]).replace(/\s+/g, ' ').indexOf(disc) >= 0) dup = true;
      });
      if (!dup) body += '<p class="leaf-disclaimer">' + nl2br(d.disclaimer) + '</p>';
    }
    if (gallery.length) {
      body += leafletSec('상세 이미지', '<div class="leaf-gallery">' + gallery.map(function (src) {
        return leafletFigure(src, (d.name || '') + ' 상세 이미지');
      }).join('') + '</div>');
    }
    return leafletHeroHTML(p, d) + '<div class="leaf-body">' + body + '</div>';
  }
  /* 상품 상세 안의 "제품 설명서 보기" 버튼 — 설명서 데이터가 있을 때만 나온다 */
  function leafletOpenHTML(p) {

  /* 설명서 → 상품 상세로 (선택한 수량 유지) */

  function confirmOrder() {

      id: uid('o'),

      branchId: branch.id,

      discount: { type: state.ui.discount.type, value: num(state.ui.discount.value), amount: t.discount },

      device: state.pub.settings.deviceName || '',
      manager: state.pub.settings.managerName || '',
      updatedAt: ts,
      syncedAt: 0
    };

    // 판매 시점 원가는 비밀 저장소에만 기록 (고객 데이터에는 남기지 않음)
    var costItems = {};
    var costTotal = 0;
    order.items.forEach(function (it) {
      var unit = costOf(it.productId);
      costItems[it.productId] = unit;
      costTotal += unit * it.qty;
    });
    state.sec.orderCosts[order.id] = { total: costTotal, items: costItems, at: ts };

    // 재고 차감 — 주문한 지점(branch)의 재고에서 빼고 출고(판매) 이력을 주문번호와 함께 남긴다.
    // 재고 기록이 없는 지점은 품목 stock 을 시작값으로 자동 생성되므로 판매가 막히지 않는다.
    order.stockApplied = applyOrderStock(order, 1) > 0;
    order.stockRestored = false;

    state.pub.orders.push(order);
    saveAll();

    clearCart();
    ['#cName', '#cPhone', '#cAddr', '#cMemo'].forEach(function (s) { var el = $(s); if (el) el.value = ''; });
    if (document.body.classList.contains('sheet-open')) document.body.classList.remove('sheet-open');
    renderCustomer();
    showReceipt(order.id);
    if (state.pub.settings.syncUrl && state.pub.settings.autoSync) {
      setTimeout(function () { pushPendingOrders(true); }, 200);
    }
  }

  /* ============ 4-6) 영수증 ============ */
  function receiptHTML(o) {
    var shop = state.pub.settings.shopName || '다시봄';

      '<div class="mark">' + telomereSVG(34) + '</div>' +

      '<dt>주문번호</dt><dd>' + esc(o.no || '') + '</dd>' +

      '</dl>' +

          '<div class="d"><span>' + fmtWon(it.price) + ' × ' + qty + '</span><span>' + fmtWon(int(it.price) * qty) + '</span></div></div>';
      }).join('') + '</div>' +

      '<div class="r total"><span>합계</span><span>' + fmtWon(o.total) + '</span></div>' +

      '<div class="rc-foot">다시봄 · 텔로미어 라이프스타일 &amp; 데일리 셀 케어<br>이용해 주셔서 감사합니다.</div>' +
      '</div>';
  }

  /* ============ 3-3) 주문 확인서 이미지(canvas) ============
     외부 라이브러리 없이 내장 <canvas>로 영수증 PNG를 그립니다.
     receiptCanvasSpec() 이 그리기 명령 목록(데이터)을 만들고,
     drawReceiptCanvas() 가 그 명령을 실제 캔버스에 실행합니다.
     공개 저장소(state.pub)·설정(paySettings)만 사용하므로 매입가·마진은 이미지에 들어가지 않습니다. */
  var RC_FONT = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif";
  /* 논리 폭 420px — 카톡·모바일에서 그대로 보기 좋은 세로로 긴 영수증 비율 (3배 = 1260px) */
  var RC_W = 420;
  var RC_PLUM = '#5D3969';
  var RC_LILAC = '#9A71A8';

  function clipText(s, n) {
    var t = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
    return t.length > n ? t.slice(0, Math.max(1, n - 1)) + '…' : t;
  }

  /* 좁은 영수증 폭에서 문장을 n자씩, 띄어쓰기 기준으로 나눈다 (최대 maxLines 줄) */
  function wrapText(s, n, maxLines) {
    var t = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
    var out = [], limit = Math.max(1, maxLines || 2);
    while (t.length > n && out.length < limit - 1) {
      var cut = t.lastIndexOf(' ', n);
      if (cut < Math.floor(n * 0.5)) cut = n;
      out.push(t.slice(0, cut).trim());
      t = t.slice(cut).trim();
    }
    if (t) out.push(clipText(t, n));
    return out.length ? out : [''];
  }

  function receiptImageName(order) {
    var no = String((order && (order.no || order.id)) || '주문').replace(/[^0-9A-Za-z가-힣_-]/g, '');
    return '다시봄_주문확인서_' + (no || '주문') + '.png';
  }

  function receiptCanvasSpec(order, shopName) {
    var o = order || {};
    var shop = shopName || state.pub.settings.shopName || '다시봄';
    var branch = o.branchName || '';
    var W = RC_W, pad = 28, right = W - pad, cw = W - pad * 2;
    var ops = [], y = 0;
    var c = o.customer || {};
    var items = o.items || [];

    function text(x, yy, s, size, color, weight, align, maxW) {
      ops.push({ t: 'text', x: x, y: yy, s: String(s == null ? '' : s), size: size, color: color,
        weight: weight || 'normal', align: align || 'left', maxW: maxW || 0 });
    }
    function rect(x, yy, w, h, color, r) { ops.push({ t: 'rect', x: x, y: yy, w: w, h: h, color: color, r: r || 0 }); }
    function line(x1, y1, x2, y2, color, w) { ops.push({ t: 'line', x1: x1, y1: y1, x2: x2, y2: y2, color: color, w: w || 1 }); }

    /* 헤더 — 좁은 폭에서는 가운데로 쌓는다: 로고 · 다시봄 · ○○점 */
    rect(0, 0, W, 176, RC_PLUM);
    ops.push({ t: 'logo', x: W / 2 - 27, y: 28, size: 54, bg: 'rgba(255,255,255,0.16)', fg: '#FFFFFF' });
    text(W / 2, 114, shop + (branch ? ' · ' + branch : ''), 20, '#FFFFFF', 'bold', 'center');
    text(W / 2, 136, '텔로미어 라이프스타일 & 데일리 셀 케어', 10.5, '#D9C2E2', 'normal', 'center');
    text(W / 2, 158, 'ORDER CONFIRMATION · 주문 확인서', 9.5, '#D9C2E2', 'bold', 'center');

    /* 주문 정보 — 라벨 왼쪽 / 값 오른쪽. 긴 값(배송지 등)은 두 줄로 나눠 적는다. */
    y = 206;
    function meta(label, value) {
      if (!value) return;
      var lines = wrapText(value, 24, 2);
      text(pad, y, label, 11.5, '#8B7A94');
      lines.forEach(function (ln, i) { text(right, y + i * 18, ln, 12.5, '#241B2B', 'bold', 'right'); });
      y += 26 + (lines.length - 1) * 18;
    }
    meta('주문번호', o.no || o.id || '');
    meta('주문일시', fmtDateTime(o.ts));
    meta('판매 채널', channelLabel(o.channel));
    meta('결제 수단', paymentLabel(o.payment));
    meta('고객명', c.name || '');
    meta('연락처', c.phone || '');
    meta('배송지', c.address || '');

    line(pad, y + 2, right, y + 2, '#E4D9EA', 1);
    y += 28;

    /* 상품 목록 — 상품명 한 줄, 그 아래 단가×수량과 금액 */
    text(pad, y, '주문 상품', 11, RC_LILAC, 'bold');
    y += 22;
    items.forEach(function (it) {
      var qty = Math.max(1, int(it.qty));
      /* 상품명은 24자씩 최대 두 줄(띄어쓰기 기준)로 나누고, 그 아래에 단가×수량·금액 */
      wrapText(it.name, 24, 2).forEach(function (ln) { text(pad, y, ln, 13.5, '#241B2B', 'bold'); y += 18; });
      text(pad, y, fmtWon(it.price) + ' × ' + qty + '개', 11, '#8B7A94');
      text(right, y, fmtWon(int(it.price) * qty), 12.5, '#241B2B', 'bold', 'right');
      y += 27;
    });

    /* 합계 */
    line(pad, y - 8, right, y - 8, '#E4D9EA', 1);
    y += 12;
    text(pad, y, '소계', 12.5, '#6A5A72');
    text(right, y, fmtWon(o.subtotal), 12.5, '#241B2B', 'normal', 'right');
    y += 24;
    var disc = int(o.discount && o.discount.amount);
    if (disc > 0) {
      text(pad, y, '할인', 12.5, '#6A5A72');
      text(right, y, '-' + fmtWon(disc), 12.5, '#241B2B', 'normal', 'right');
      y += 24;
    }
    line(pad, y + 2, right, y + 2, '#E4D9EA', 1);
    y += 24;
    text(pad, y, '합계', 14, RC_PLUM, 'bold');
    text(right, y, fmtWon(o.total), 22, RC_PLUM, 'bold', 'right');
    y += 26;

    /* 입금 계좌 · 송금 링크 — 좁은 폭에서는 라벨 아래에 값을 쌓는다 */
    var pay = paySettings();
    var link = safeTransferLink(pay.link);
    if (pay.account || link) {
      var rows = (pay.account ? 1 : 0) + (link ? 1 : 0);
      var bh = 18 + rows * 38 + 6;
      rect(pad, y, cw, bh, '#F6F1F8', 10);
      var ty = y + 22;
      if (pay.account) {
        text(pad + 14, ty, '입금 계좌', 10.5, '#8B7A94', 'bold');
        text(pad + 14, ty + 17, clipText(accountLine(), 38), 12, '#3D2F45', 'bold');
        ty += 38;
      }
      if (link) {
        text(pad + 14, ty, '송금 링크', 10.5, '#8B7A94', 'bold');
        text(pad + 14, ty + 17, clipText(link, 46), 11, RC_PLUM);
        ty += 38;
      }
      y += bh + 22;
    }

    /* 꼬리말 */
    line(pad, y, right, y, '#E4D9EA', 1);
    y += 26;
    text(W / 2, y, shop + ' · 텔로미어 라이프스타일 & 데일리 셀 케어', 10.5, '#8B7A94', 'normal', 'center');
    y += 20;
    text(W / 2, y, '이용해 주셔서 감사합니다.', 12, RC_LILAC, 'bold', 'center');
    y += 30;

    return { width: W, height: Math.round(y), scale: 3, shop: shop, branch: branch, ops: ops };
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  /* 텔로미어 마크: 두 가닥이 중앙에서 교차하고 네 끝에 캡 */
  function drawLogoMark(ctx, op) {
    var cx = op.x + op.size / 2, cy = op.y + op.size / 2, r = op.size / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = op.bg || '#EFE6F3';
    ctx.fill();
    ctx.strokeStyle = op.fg || RC_PLUM;
    ctx.lineWidth = Math.max(1, op.size * 0.045);
    ctx.lineCap = 'round';
    var a = r * 0.52, b = r * 0.34;
    ctx.beginPath();
    ctx.moveTo(cx - a, cy - b);
    ctx.bezierCurveTo(cx - r * 0.12, cy - r * 0.12, cx - r * 0.12, cy + r * 0.12, cx + a, cy + b);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - a, cy + b);
    ctx.bezierCurveTo(cx - r * 0.12, cy + r * 0.12, cx - r * 0.12, cy - r * 0.12, cx + a, cy - b);
    ctx.stroke();
    [[-a, -b], [a, b], [-a, b], [a, -b]].forEach(function (p) {
      ctx.beginPath();
      ctx.arc(cx + p[0], cy + p[1], Math.max(1, op.size * 0.05), 0, Math.PI * 2);
      ctx.fillStyle = op.fg || RC_PLUM;
      ctx.fill();
    });
  }

  function drawReceiptCanvas(spec) {
    var scale = spec.scale || 3;
    var cv = document.createElement('canvas');
    cv.width = Math.round(spec.width * scale);
    cv.height = Math.round(spec.height * scale);
    var ctx = cv.getContext('2d');
    if (!ctx) throw new Error('canvas 2d context 없음');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, spec.width, spec.height);
    ctx.textBaseline = 'alphabetic';
    (spec.ops || []).forEach(function (op) {
      if (op.t === 'rect') {
        ctx.fillStyle = op.color;
        if (op.r) { roundRectPath(ctx, op.x, op.y, op.w, op.h, op.r); ctx.fill(); }
        else ctx.fillRect(op.x, op.y, op.w, op.h);
      } else if (op.t === 'line') {
        ctx.strokeStyle = op.color; ctx.lineWidth = op.w || 1;
        ctx.beginPath(); ctx.moveTo(op.x1, op.y1); ctx.lineTo(op.x2, op.y2); ctx.stroke();
      } else if (op.t === 'text') {
        ctx.font = (op.weight && op.weight !== 'normal' ? op.weight + ' ' : '') + op.size + 'px ' + RC_FONT;
        ctx.fillStyle = op.color;
        ctx.textAlign = op.align || 'left';
        ctx.fillText(op.s, op.x, op.y, op.maxW || undefined);
      } else if (op.t === 'logo') {
        drawLogoMark(ctx, op);
      }
    });
    return cv;
  }

  function dataURLtoBlob(dataURL) {
    var parts = String(dataURL || '').split(',');
    var mime = (parts[0].match(/:(.*?);/) || [])[1] || 'image/png';
    var bin = atob(parts[1] || '');
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  function receiptCanvasBlob(order, shopName) {
    return new Promise(function (resolve, reject) {
      try {
        var cv = drawReceiptCanvas(receiptCanvasSpec(order, shopName));
        if (cv.toBlob) {
          cv.toBlob(function (b) { b ? resolve(b) : reject(new Error('이미지 생성 실패')); }, 'image/png');
        } else {
          resolve(dataURLtoBlob(cv.toDataURL('image/png')));
        }
      } catch (e) { reject(e); }
    });
  }

  function downloadReceiptImage(blob, name) {
    try {
      var URL0 = (typeof window !== 'undefined' && (window.URL || window.webkitURL)) || null;
      if (!URL0 || !URL0.createObjectURL) throw new Error('다운로드 미지원');
      var url = URL0.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try { document.body.removeChild(a); } catch (e) { /* noop */ }
        try { URL0.revokeObjectURL(url); } catch (e) { /* noop */ }
      }, 4000);
      toast(name + ' 저장을 시작했습니다.');
    } catch (e) {
      toast('이미지를 저장하지 못했습니다. 인쇄로 PDF 저장을 이용해 주세요.');
    }
  }

  /* 카톡 등 공유 시트 → 미지원·취소 시 파일 저장 */
  function shareReceiptImage(orderId) {
    var o = findOrder(orderId);
    if (!o) return;
    var shop = state.pub.settings.shopName || '다시봄';
    var name = receiptImageName(o);
    receiptCanvasBlob(o, shop).then(function (blob) {
      var file = null;
      try { file = new File([blob], name, { type: 'image/png' }); } catch (e) { file = null; }
      var nav = (typeof navigator !== 'undefined') ? navigator : null;
      var canShareFile = false;
      if (file && nav && nav.canShare && nav.share) {
        try { canShareFile = !!nav.canShare({ files: [file] }); } catch (e) { canShareFile = false; }
      }
      if (canShareFile) {
        return nav.share({ files: [file], title: shop + ' 주문 확인서', text: '주문번호 ' + (o.no || '') + ' 주문 확인서입니다.' })
          .then(function () { toast('공유할 앱을 골라 보내세요.'); })
          .catch(function (err) {
            if (err && err.name === 'AbortError') toast('공유를 취소해 이미지로 저장합니다.');
            downloadReceiptImage(blob, name);
          });
      }
      downloadReceiptImage(blob, name);
      return null;
    }).catch(function () {
      toast('이미지를 만들지 못했습니다. 인쇄로 PDF 저장을 이용해 주세요.');
    });
  }

  function showReceipt(orderId) {
    var o = findOrder(orderId);
    if (!o) return;
    var html = '<div class="modal narrow rc-modal" role="dialog" aria-modal="true" aria-labelledby="rcTitle">' +
      '<div class="modal-head"><h2 id="rcTitle">주문 확인서</h2><span class="kicker">Thank You</span>' +
      '<button type="button" class="icon-btn" data-act="modal:close" aria-label="닫기">✕</button></div>' +
      '<div class="modal-body">' + receiptHTML(o) +
      '<p class="copy-note">카카오톡·문자로 보내려면 아래 복사 버튼을 누르세요. 이미지로 보내려면 <b>이미지 저장 / 카톡 공유</b>를 누르면 됩니다.</p></div>' +
      '<div class="modal-foot" style="flex-wrap:wrap">' +
      '<button type="button" class="btn sm gold" data-act="rc:copy" data-id="' + esc(o.id) + '">카카오톡 복사</button>' +
      '<button type="button" class="btn sm" data-act="rc:sms" data-id="' + esc(o.id) + '">문자 복사</button>' +
      '<button type="button" class="btn sm primary" data-act="rc:image" data-id="' + esc(o.id) + '">이미지 저장 / 카톡 공유</button>' +
      '<button type="button" class="btn sm" data-act="rc:print" data-id="' + esc(o.id) + '">인쇄</button>' +
      '<span class="grow"></span>' +
      '<button type="button" class="btn primary sm" data-act="modal:close">닫기</button>' +
      '</div></div>';
    openModal(html, { noFocus: true });
  }

  function copyText(text) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand && document.execCommand('copy');
        document.body.removeChild(ta);
        return !!ok;
      } catch (e) { return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; })
        .catch(function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  function copyReceipt(id, kind) {
    var o = findOrder(id);
    if (!o) return;
    var shop = state.pub.settings.shopName || '다시봄';
    var text = kind === 'sms' ? buildShortText(o, shop) : buildReceiptText(o, shop);
    copyText(text).then(function (ok) {
      if (ok) toast(kind === 'sms' ? '문자용 문구를 복사했습니다.' : '카카오톡용 확인서를 복사했습니다.');
      else showCopyFallback(text);
    });
  }
  function showCopyFallback(text) {

  /* ============ 5) 관리자 ============ */
  function pendingOrders() {

  function maxSort() {
    var m = 0;
    state.pub.products.forEach(function (p) { m = Math.max(m, num(p.sort)); });
    return m;
  }
  function orderCostRecord(o) {
    var rec = state.sec.orderCosts[o.id];
    var total = 0, known = true, map = {};
    (o.items || []).forEach(function (it) {
      var unit = null;
      if (rec && rec.items && rec.items[it.productId] != null) unit = num(rec.items[it.productId]);
      else if (Object.prototype.hasOwnProperty.call(state.sec.costs, it.productId)) unit = costOf(it.productId);
      else { unit = 0; known = false; }
      map[it.productId] = unit;
      total += unit * Math.max(1, int(it.qty));
    });
    return { total: total, items: map, known: known };
  }

  /* ---- 정산 집계 ---- */
  function computeSettle(opt) {
    opt = opt || {};
    var from = typeof opt.from === 'number' ? opt.from : 0;
    var to = typeof opt.to === 'number' ? opt.to : Infinity;
    var branchId = opt.branchId || 'all';

    var list = (state.pub.orders || []).filter(function (o) {
      if (isClosedStatus(o.status)) return false;
      if (branchId !== 'all' && o.branchId !== branchId) return false;
      if (o.ts < from || o.ts >= to) return false;
      return true;
    });

    var res = {
      count: list.length, qty: 0, revenue: 0, cost: 0, margin: 0, rate: 0,
      unknownCost: false,
      byChannel: {}, byPayment: {}, byBranch: {}, byProduct: []
    };
    var prodMap = {};

    list.forEach(function (o) {
      var c = orderCostRecord(o);
      if (!c.known) res.unknownCost = true;
      var revenue = num(o.total);
      var cost = c.total;
      var margin = revenue - cost;
      res.revenue += revenue;
      res.cost += cost;

      var chKey = o.channel || 'offline';
      var pkKey = o.payment || 'cash';
      var brKey = o.branchId || 'none';
      var brName = o.branchName || '(지점 없음)';

      function bump(bag, key, label) {
        if (!bag[key]) bag[key] = { key: key, label: label, count: 0, qty: 0, revenue: 0, cost: 0, margin: 0 };
        bag[key].count += 1;
        bag[key].revenue += revenue;
        bag[key].cost += cost;
        bag[key].margin += margin;
        return bag[key];
      }
      bump(res.byChannel, chKey, channelLabel(chKey));
      bump(res.byPayment, pkKey, paymentLabel(pkKey));
      bump(res.byBranch, brKey, brName);

      (o.items || []).forEach(function (it) {
        var qty = Math.max(1, int(it.qty));
        res.qty += qty;
        var key = it.productId || it.name;
        if (!prodMap[key]) {
          prodMap[key] = { key: key, name: it.name, qty: 0, revenue: 0, cost: 0, margin: 0 };
        }
        var unitCost = c.items[it.productId] != null ? c.items[it.productId] : 0;
        prodMap[key].qty += qty;
        prodMap[key].revenue += int(it.price) * qty;
        prodMap[key].cost += unitCost * qty;
        prodMap[key].margin += (int(it.price) - unitCost) * qty;
      });
    });

    res.margin = res.revenue - res.cost;
    res.rate = res.revenue > 0 ? Math.round((res.margin / res.revenue) * 1000) / 10 : 0;
    res.byProduct = Object.keys(prodMap).map(function (k) { return prodMap[k]; })
      .sort(function (a, b) { return b.revenue - a.revenue; });
    res.orders = list;
    return res;
  }

  function periodRange(period, fromStr, toStr) {
    var now = Date.now();
    var t0 = dayStart(now);
    if (period === 'today') return { from: t0, to: addDays(t0, 1) };
    if (period === '7d') return { from: addDays(t0, -6), to: addDays(t0, 1) };
    if (period === '30d') return { from: addDays(t0, -29), to: addDays(t0, 1) };
    if (period === 'month') {
      var d = new Date(now); d.setDate(1); d.setHours(0, 0, 0, 0);
      return { from: d.getTime(), to: addDays(t0, 1) };
    }
    if (period === 'custom') {
      var f = fromStr ? new Date(fromStr + 'T00:00:00').getTime() : 0;
      var t = toStr ? addDays(new Date(toStr + 'T00:00:00').getTime(), 1) : addDays(t0, 1);
      return { from: f, to: t };
    }
    return { from: 0, to: Infinity };
  }

  /* ---- 본점 판매 모니터링 (지점 통합 현황) ---- */
  var MON_PERIODS = [
    { v: 'today', label: '오늘' }, { v: 'week', label: '이번주' },
    { v: 'month', label: '이번달' }, { v: 'all', label: '전체' }
  ];
  function monitorRange(period) {
    var now = Date.now();
    var t0 = dayStart(now);
    if (period === 'week') {
      var d = new Date(now);
      var dow = (d.getDay() + 6) % 7;   // 월요일 = 0
      return { from: addDays(t0, -dow), to: addDays(t0, 1) };
    }
    if (period === 'month') {
      var m = new Date(now);
      m.setDate(1);
      m.setHours(0, 0, 0, 0);
      return { from: m.getTime(), to: addDays(t0, 1) };
    }
    if (period === 'all') return { from: 0, to: Infinity };
    return { from: t0, to: addDays(t0, 1) };
  }
  /* 지점별 매출·건수·예상 마진 + 기간 합계 */
  function monitorStats() {
    var range = monitorRange(state.ui.monPeriod || 'today');
    var total = computeSettle({ from: range.from, to: range.to, branchId: 'all' });
    var branches = branchList().map(function (b) {
      var s = computeSettle({ from: range.from, to: range.to, branchId: b.id });
      var lowN = 0, outN = 0;
      state.pub.products.forEach(function (p) {
        if (p.visible === false) return;
        var st = stockStateOf(p.id, b.id);
        if (st.state === 'out') outN++;
        else if (st.state === 'low') lowN++;
      });
      return { id: b.id, name: b.name, type: b.type, data: s, low: lowN, out: outN };
    });
    return { range: range, total: total, branches: branches };
  }
  function monitorOrders() {
    var range = monitorRange(state.ui.monPeriod || 'today');
    var br = state.ui.monBranch || 'all';
    return (state.pub.orders || []).filter(function (o) {
      if (!o) return false;
      if (br !== 'all' && o.branchId !== br) return false;
      if (num(o.ts) < range.from || num(o.ts) >= range.to) return false;
      return true;
    }).sort(function (a, b) { return num(b.ts) - num(a.ts); });
  }
  function orderItemsSummary(o) {
    var items = (o && o.items) || [];
    if (!items.length) return '-';
    if (items.length === 1) return items[0].name + ' ×' + items[0].qty;
    return items[0].name + ' ×' + items[0].qty + ' 외 ' + (items.length - 1) + '건';

  /* 모니터링 화면에 들어올 때·새로고침을 누를 때 시트에서 다른 지점 내역까지 다시 불러온다.
     20초 안에 다시 들어온 경우에는 중복 요청을 하지 않는다. */
  var monLastEnter = 0;
  function monOnEnter() {
    if (!syncUrl()) return;
    var now = Date.now();
    if (now - monLastEnter < 20000) return;
    monLastEnter = now;
    refreshMonitor(true);
  }
  function pushPendingSilent() {
    var list = pendingOrders();
    if (!list.length || !syncUrl()) return new Promise(function (res) { res(null); });
    return apiPost({ action: 'orders.push', orders: list.map(orderPayload) }).then(function (d) {
      var now = Date.now();
      list.forEach(function (o) { o.syncedAt = now; });
      saveAll();
      return d;
    }).catch(function () { return null; });
  }
  function refreshMonitor(silent) {
    if (!syncUrl()) {
      state.ui.monBusy = false;
      state.ui.monMsg = '';
      if (!silent) {
        renderAdminTab();
        toast('지금은 이 기기 데이터로 보여 줍니다. 동기화 탭에서 구글 시트를 연결하면 다른 지점 내역까지 함께 나옵니다.');
      }
      return;
    }
    state.ui.monBusy = true;
    state.ui.monMsg = '시트에서 불러오는 중…';
    if (state.ui.tab === 'monitor') renderAdminTab();
    pushPendingSilent()
      .then(function () { return syncStockPush(true); })
      .then(function () { return apiGet({ action: 'all' }); })
      .then(function (d) {
        (d.orders || []).forEach(mergeRemoteOrder);
        mergeRemoteStock(d);
        state.pub.settings.lastSyncAt = Date.now();
        state.ui.monBusy = false;
        state.ui.monMsg = '방금 갱신';
        saveAll();
        if (state.ui.tab === 'monitor') renderAdminTab();
        if (!silent) toast('모니터링을 새로고침했습니다.');
      })
      .catch(function (e) {
        state.ui.monBusy = false;
        state.ui.monMsg = '갱신 실패: ' + ((e && e.message) ? e.message : String(e));
        if (state.ui.tab === 'monitor') renderAdminTab();
        if (!silent) toast('새로고침 실패 — ' + state.ui.monMsg);
      });
  }

  function updatePfMargin() {
    var price = int(val('#pfPrice'));
    var cost = int(val('#pfCost'));

    var box = $('#pfMargin');
    if (box) box.innerHTML = '마진 <b class="' + (m.margin >= 0 ? '' : 'margin-neg') + '">' + fmtWon(m.margin) + '</b> · 마진율 <b>' + calcMargin(price, cost).rate.toFixed(1) + '%</b>' +
      '<span class="hint">소비자가 ' + fmtWon(price) + ' − 매입가 ' + fmtWon(cost) + '</span>';
    var prev = $('#pfPreview');
    if (prev) {
      var url = val('#pfImage').trim();
      prev.innerHTML = url ? '<img src="' + esc(url) + '" alt="미리보기" onerror="this.style.display=\'none\'">'
        : '<span class="hint">이미지 주소를 넣으면 미리보기가 표시됩니다.</span>';
    }

  function saveProductForm() {
    var name = val('#pfName').trim();
    if (!name) { toast('상품명을 입력해 주세요.'); return; }
    var price = int(val('#pfPrice'));
    if (price <= 0) { toast('소비자가를 입력해 주세요.'); return; }
    var cost = int(val('#pfCost'));
    if (cost > price && !(typeof window !== 'undefined' && window.confirm('매입가가 소비자가보다 큽니다. 마이너스 마진이 됩니다.\n그대로 저장할까요?'))) return;

    var p = state.ui.editingId ? productById(state.ui.editingId) : null;
    if (!p) {
      p = { id: uid('p'), createdAt: Date.now() };
      state.pub.products.push(p);
    }
    p.name = name;
    p.category = val('#pfCat').trim() || '기타';
    p.summary = val('#pfSummary').trim();
    p.points = val('#pfPoints').split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    p.ingredients = val('#pfIng').trim();
    p.usage = val('#pfUsage').trim();
    p.caution = val('#pfCaution').trim();
    p.image = val('#pfImage').trim();
    p.price = price;
    p.pv = val('#pfPv');
    p.stock = int(val('#pfStock'));
    p.sort = int(val('#pfSort')) || (maxSort() + 10);
    p.updatedAt = Date.now();
    if (p.visible == null) p.visible = true;
    if (p.soldout == null) p.soldout = false;

    state.sec.costs[p.id] = cost;
    if ($('#pfCostEx') && $('#pfCostEx').checked) state.sec.costExample[p.id] = true;
    else delete state.sec.costExample[p.id];

    saveAll();
    state.ui.editingId = null;
    closeModal();
    toast('저장했습니다.');
    renderAdminTab();
  }

  function lastStockLog(branchId, productId) {
    var logs = state.pub.stockLogs || [];
    for (var i = logs.length - 1; i >= 0; i--) {

    return null;

  /* 재고 탭의 품목 목록 — 지점·라인·검색으로 좁힌 뒤 상태 필터를 적용한다 */
  function stockRows(opts) {
    opts = opts || {};
    var branchId = opts.branchId || stockBranchId();
    var cat = (opts.cat != null ? opts.cat : (state.ui.stockCat || 'all'));
    var q = String(opts.query != null ? opts.query : (state.ui.stockQuery || '')).trim().toLowerCase();
    var stFilter = opts.state != null ? opts.state : (state.ui.stockState || 'all');
    var out = [];
    state.pub.products.slice()
      .sort(function (a, b) { return num(a.sort) - num(b.sort); })
      .forEach(function (p) {
        if (!p) return;

          if (hay.indexOf(q) < 0) return;
        }
        var st = stockStateOf(p.id, branchId);
        out.push({
          product: p, qty: st.qty, safety: st.safety, tracked: st.tracked,
          state: st.state, log: lastStockLog(branchId, p.id)
        });
      });
    if (stFilter !== 'all') out = out.filter(function (r) { return r.state === stFilter; });

  /* 주문 상태에 맞춰 재고를 한 번만 반영한다 — 중복 차감·중복 복원 방지.
     · 취소·환불: 지점 재고를 입고(주문취소) 이력과 함께 되돌리고 stockRestored=true 로 표시
     · 다시 판매 상태(접수·결제완료·완료)로 돌리면 재차감(출고) 후 표시를 바꾼다 */
  function syncOrderStock(o) {
    if (!o) return false;
    if (isClosedStatus(o.status)) {
      if (o.stockRestored) return false;
      applyOrderStock(o, -1);
      o.stockRestored = true;
      o.stockApplied = false;
      return true;
    }
    if (o.stockRestored || o.stockApplied === false) {
      applyOrderStock(o, 1);
      o.stockRestored = false;
      o.stockApplied = true;
      return true;
    }
    return false;
  }

  function downloadFile(filename, text, mime) {
    try {
      var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 400);
    } catch (e) { toast('파일을 만들 수 없습니다. 브라우저 설정을 확인해 주세요.'); }
  }

  /* ============ 5-1) 동기화 (Google Apps Script) ============ */
  function syncUrl() { return (state.pub.settings.syncUrl || '').trim(); }

  function parseResponse(text) {
    var t = String(text || '').trim();
    if (!t) throw new Error('빈 응답입니다. 웹앱 배포 상태를 확인하세요.');
    var data;
    try { data = JSON.parse(t); }
    catch (e) {
      throw new Error('JSON 응답이 아닙니다. 웹앱 배포 시 "액세스 권한: 모든 사용자"로 설정했는지 확인하세요.');
    }
    if (!data || data.ok === false) throw new Error((data && data.error) || '시트에서 오류를 반환했습니다.');
    return data;
  }

  function apiGet(params) {
    var url = syncUrl();
    if (!url) return Promise.reject(new Error('동기화 URL이 비어 있습니다. 설정에서 먼저 입력해 주세요.'));
    if (typeof fetch !== 'function') return Promise.reject(new Error('이 브라우저에서는 시트 동기화를 쓸 수 없습니다.'));
    var qs = Object.keys(params || {}).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    var full = url + (url.indexOf('?') >= 0 ? '&' : '?') + qs;
    return fetch(full, { method: 'GET', redirect: 'follow', cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(parseResponse);
  }

  function apiPost(payload) {
    var url = syncUrl();
    if (!url) return Promise.reject(new Error('동기화 URL이 비어 있습니다. 설정에서 먼저 입력해 주세요.'));
    if (typeof fetch !== 'function') return Promise.reject(new Error('이 브라우저에서는 시트 동기화를 쓸 수 없습니다.'));
    return fetch(url, {
      method: 'POST',
      redirect: 'follow',
      cache: 'no-store',
      // text/plain 으로 보내야 CORS preflight(OPTIONS) 없이 Apps Script에 도달합니다.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(parseResponse);
  }

  function syncStart(msg) {
    state.ui.syncBusy = true;
    state.ui.syncMsg = msg || '동기화 중…';
    state.ui.syncOk = null;
    refreshSyncBox();
  }
  function syncDone(ok, msg) {
    state.ui.syncBusy = false;
    state.ui.syncOk = ok;
    state.ui.syncMsg = msg;
    if (ok) {
      state.pub.settings.lastSyncAt = Date.now();
      state.pub.settings.lastSyncNote = msg;
      savePub();
    }
    refreshSyncBox();
    if (ok) toast(msg); else toast('동기화 실패: ' + msg);
  }
  function refreshSyncBox() {
    var box = $('#syncBox');
    if (!box) return;
    var st = state.ui.syncBusy ? 'busy' : (state.ui.syncOk === true ? 'ok' : (state.ui.syncOk === false ? 'err' : ''));
    box.innerHTML = syncStatusHTML(st);
  }

      '<div class="hint">마지막 동기화: ' + (s.lastSyncAt ? fmtDateTime(s.lastSyncAt) : '없음') +
      ' · 미전송 주문 ' + pend + '건</div>' +

        };

  function orderPayload(o) {
    var c = orderCostRecord(o);
    return extend(extend({}, o), { costTotal: c.total, costItems: c.items, cogsKnown: c.known });

  /* ---- 재고·입출고 이력 시트 동기화 ---- */
  function stockInventoryPayload() {
    var rows = [];
    var inv = state.pub.inventory || {};
    Object.keys(inv).forEach(function (branchId) {
      var bag = inv[branchId] || {};
      Object.keys(bag).forEach(function (productId) {
        var rec = bag[productId] || {};
        var p = productById(productId);
        rows.push({
          branchId: branchId,
          branch: branchNameOf(branchId),
          productId: productId,
          name: p ? p.name : '',
          qty: Math.max(0, int(rec.qty)),
          safetyQty: Math.max(0, int(rec.safetyQty)),
          updatedAt: num(rec.updatedAt) || Date.now()
        });
      });
    });
    return rows;
  }
  function stockLogPayload(l) {
    return {
      id: l.id, at: num(l.at), branchId: l.branchId || '',
      branch: l.branchName || branchNameOf(l.branchId),
      productId: l.productId || '', name: l.name || '', type: l.type || 'adjust',
      qty: num(l.qty), before: num(l.before), after: num(l.after),
      memo: l.memo || '', orderId: l.orderId || '', orderNo: l.orderNo || '',
      device: l.device || '', manager: l.manager || ''
    };
  }
  function pendingStockLogs() {
    return (state.pub.stockLogs || []).filter(function (l) { return l && !l.syncedAt; });
  }
  /* 이 기기의 재고 현황과 아직 안 올라간 이력을 시트로 보낸다. */
  function syncStockPush(silent) {
    if (!syncUrl()) return new Promise(function (res) { res(null); });
    var inv = stockInventoryPayload();
    var logs = pendingStockLogs().map(stockLogPayload);
    return apiPost({ action: 'stock.push', inventory: inv, logs: logs }).then(function (d) {
      var now = Date.now();
      (state.pub.stockLogs || []).forEach(function (l) { if (l && !l.syncedAt) l.syncedAt = now; });
      saveAll();
      if (!silent) toast('재고 ' + inv.length + '건 · 이력 ' + logs.length + '건을 시트에 보냈습니다.');
      return d;
    }).catch(function (e) {
      if (!silent) syncDone(false, e && e.message ? e.message : String(e));
      return null;
    });
  }
  function mergeRemoteInventory(rows) {
    var n = 0;
    (rows || []).forEach(function (r) {
      if (!r || !r.branchId || !r.branchId) return;
      if (!r.productId) return;
      var bag = invBag(r.branchId, true);
      if (!bag) return;
      var cur = bag[r.productId];
      var at = num(r.updatedAt) || 0;
      if (!cur || at >= num(cur.updatedAt)) {
        bag[r.productId] = {
          qty: Math.max(0, int(r.qty)),
          safetyQty: Math.max(0, int(r.safetyQty)),
          updatedAt: at || Date.now()
        };
        n++;
      }
    });
    return n;
  }
  function mergeRemoteStockLogs(rows) {
    var have = {};
    (state.pub.stockLogs || []).forEach(function (l) { if (l && l.id) have[l.id] = true; });
    var added = 0;
    (rows || []).forEach(function (r) {
      if (!r || !r.id || have[r.id]) return;
      state.pub.stockLogs.push({
        id: String(r.id), at: num(r.at),
        branchId: r.branchId || '', branchName: r.branch || branchNameOf(r.branchId),
        productId: r.productId || '', name: r.name || '', type: r.type || 'adjust',
        qty: num(r.qty), before: num(r.before), after: num(r.after), memo: r.memo || '',
        orderId: r.orderId || '', orderNo: r.orderNo || '',
        device: r.device || '', manager: r.manager || '', syncedAt: Date.now()
      });
      have[r.id] = true;
      added++;
    });
    if (state.pub.stockLogs.length > STOCK_LOG_MAX) {
      state.pub.stockLogs = state.pub.stockLogs.slice(state.pub.stockLogs.length - STOCK_LOG_MAX);
    }
    return added;
  }
  function mergeRemoteStock(d) {
    var a = mergeRemoteInventory(d && d.inventory);
    var b = mergeRemoteStockLogs(d && d.stockLogs);
    return { inventory: a, logs: b };
  }

  function pushPendingOrders(silent) {
    var list = pendingOrders();
    if (!list.length) { if (!silent) toast('전송할 주문이 없습니다.'); return; }
    if (!syncUrl()) { if (!silent) toast('동기화 URL을 먼저 입력해 주세요.'); return; }
    if (!silent) syncStart('주문 ' + list.length + '건을 전송하는 중…');
    apiPost({ action: 'orders.push', orders: list.map(orderPayload) }).then(function (d) {
      var now = Date.now();
      list.forEach(function (o) { o.syncedAt = now; });
      saveAll();
      if (!silent) { syncDone(true, '주문 ' + list.length + '건을 전송했습니다.'); renderAdminTab(); }
      else { state.pub.settings.lastSyncAt = now; savePub(); }
    }).catch(function (e) { if (!silent) syncDone(false, e.message || String(e)); });
  }

  function pushOrderStatus(o) {
    apiPost({ action: 'order.status', id: o.id, status: o.status, updatedAt: o.updatedAt })
      .catch(function () { /* 다음 동기화에서 재시도 */ });

  function mergeRemoteOrder(r) {
    var local = findOrder(r.id);
    var pubProps = {
      no: r.no, ts: num(r.ts), branchId: r.branchId || r.branch || '', branchName: r.branchName || r.branch || '',
      channel: r.channel, payment: r.payment,
      customer: r.customer || {},
      items: Array.isArray(r.items) ? r.items : (function () { try { return JSON.parse(r.itemsJson || '[]'); } catch (e) { return []; } })(),
      discount: r.discount || { type: 'none', value: 0, amount: num(r.discountAmount) },
      subtotal: num(r.subtotal), total: num(r.total),
      status: r.status || 'received',
      device: r.device || '', manager: r.manager || '',
      updatedAt: num(r.updatedAt) || num(r.ts) || Date.now(),
      syncedAt: Date.now(),
      id: r.id
    };
    if (!local) {
      state.pub.orders.push(pubProps);
    } else if (num(pubProps.updatedAt) > num(local.updatedAt)) {
      for (var k in pubProps) local[k] = pubProps[k];
    } else {
      local.syncedAt = Date.now();
    }
    var costItems = r.costItems;
    if (typeof costItems === 'string') { try { costItems = JSON.parse(costItems); } catch (e) { costItems = null; } }
    if (costItems && typeof costItems === 'object') {
      state.sec.orderCosts[r.id] = { total: num(r.costTotal), items: costItems, at: num(r.ts) || Date.now() };
    } else if (r.costTotal != null) {
      state.sec.orderCosts[r.id] = { total: num(r.costTotal), items: {}, at: num(r.ts) || Date.now() };
    }
  }

  function pullOrders() {
    if (!syncUrl()) { toast('동기화 URL을 먼저 입력해 주세요.'); return; }
    syncStart('시트에서 주문을 불러오는 중…');
    apiGet({ action: 'all' }).then(function (d) {
      var list = Array.isArray(d.orders) ? d.orders : [];
      list.forEach(mergeRemoteOrder);
      mergeRemoteStock(d);
      saveAll();
      syncDone(true, '주문 ' + list.length + '건·재고를 확인했습니다.');
      renderAdminTab();
    }).catch(function (e) { syncDone(false, e.message || String(e)); });
  }

  function pushStockAction() {
    if (!syncUrl()) { toast('동기화 URL을 먼저 입력해 주세요.'); return; }
    syncStart('재고·이력을 시트로 보내는 중…');
    syncStockPush(true).then(function (d) {
      if (d === null) { syncDone(false, '재고를 보내지 못했습니다.'); return; }
      syncDone(true, '재고 ' + stockInventoryPayload().length + '건을 시트에 저장했습니다.');
      renderAdminTab();
    }).catch(function (e) { syncDone(false, e.message || String(e)); });
  }
  function pullStockAction() {
    if (!syncUrl()) { toast('동기화 URL을 먼저 입력해 주세요.'); return; }
    syncStart('시트에서 재고를 불러오는 중…');
    apiGet({ action: 'all' }).then(function (d) {
      (d.orders || []).forEach(mergeRemoteOrder);
      var m = mergeRemoteStock(d);
      saveAll();
      syncDone(true, '주문 ' + (d.orders || []).length + '건 · 재고 ' + m.inventory + '건 · 이력 ' + m.logs + '건을 반영했습니다.');
      renderAdminTab();
    }).catch(function (e) { syncDone(false, e.message || String(e)); });
  }

  function syncNow() {
    if (!syncUrl()) { toast('동기화 URL을 먼저 입력해 주세요.'); return; }
    syncStart('전체 동기화 중…');
    apiPost({ action: 'orders.push', orders: pendingOrders().map(orderPayload) })
      .then(function () { return syncStockPush(true); })
      .then(function () { return apiGet({ action: 'all' }); })
      .then(function (d) {
        (d.orders || []).forEach(mergeRemoteOrder);
        mergeRemoteStock(d);
        var now = Date.now();
        (state.pub.orders || []).forEach(function (o) { if (!o.syncedAt) o.syncedAt = now; });
        saveAll();
        syncDone(true, '전체 동기화 완료 · 주문 ' + (d.orders || []).length + '건 · 재고 반영');
        renderAdminTab();
      })
      .catch(function (e) { syncDone(false, e.message || String(e)); });
  }

  var autoTimer = null;
  function armAutoSync() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    var s = state.pub.settings;
    if (!s.autoSync || !syncUrl()) return;
    var sec = Math.max(20, num(s.autoSyncSec) || 60);
    autoTimer = setInterval(function () {
      if (document.hidden) return;
      if (pendingOrders().length) pushPendingOrders(true);
      else pullOrdersSilent();
    }, sec * 1000);
  }
  function pullOrdersSilent() {
    apiGet({ action: 'all' }).then(function (d) {
      (d.orders || []).forEach(mergeRemoteOrder);
      mergeRemoteStock(d);
      savePub(); saveSec();
      state.pub.settings.lastSyncAt = Date.now();
      savePub();
      refreshSyncBox();
      if (state.ui.tab === 'monitor' && state.ui.mode === 'admin') renderAdminTab();
    }).catch(function () { /* 조용히 무시 */ });
  }

      if (!state.pub.settings.defaultBranchId) state.pub.settings.defaultBranchId = list[0].id;

    if (!branchById(state.pub.settings.currentBranchId)) state.pub.settings.currentBranchId = state.pub.settings.defaultBranchId || (list[0] && list[0].id);

    closeModal();

  function deleteBranch(id) {
    var list = branchList();
    if (list.length <= 1) { toast('지점은 최소 1개가 필요합니다.'); return; }
    var b = branchById(id);
    if (!b) return;
    if (!window.confirm('"' + b.name + '" 지점을 삭제할까요?\n이미 기록된 주문의 지점명은 그대로 남습니다.')) return;
    state.pub.settings.branches = list.filter(function (x) { return x.id !== id; });
    if (state.pub.settings.defaultBranchId === id) state.pub.settings.defaultBranchId = state.pub.settings.branches[0].id;
    if (state.pub.settings.currentBranchId === id) state.pub.settings.currentBranchId = state.pub.settings.defaultBranchId;
    dropBranchSellerPin(id);   // 지점 전용 비밀번호 해시도 함께 정리
    savePub();
    renderAdmin();
    renderCustomer();
  }
